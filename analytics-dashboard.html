  // ===================================================================
  // v2 — THE EIGHT RANKED QUESTIONS (2026-11-20)
  //
  // Each section below is driven by ONE top-level snapshot key. The SQL that
  // produces those keys ships separately and may land after this page, so every
  // section checks `present()` first and renders a quiet, explained
  // "not yet reported" panel instead of zeros, NaNs or an empty box.
  // Feed this file the pre-v2 snapshot and nothing breaks: you get eight
  // placeholders and the whole original dashboard.
  //
  // Every rate goes through `rate()` (see the honest-rate rule at the top):
  // the absolute always travels with the percentage, and a base under
  // MIN_BASE prints as a raw fraction rather than a confident percentage.
  // ===================================================================
  var V2_KEYS=[
    ['arrival','Arrival shape','whether a new person arrives alone — and how much more a user with friends trains'],
    ['invite_loop','Invite loop','every step from invite sent to first check-in, in absolute numbers'],
    ['features','What we shipped','adoption per shipped feature, so a dead one is visible instead of assumed live'],
    ['social_depth','Social depth','whether engagement is broad or carried by one person'],
    ['streaks','Streak health','how many flames are alive, at risk, broken or paused'],
    ['verification','Verification','the verified share of recent check-ins, and why the rest are not'],
    ['notifications','Notifications','what we send, by type, and how many devices can receive it'],
    ['compliance','Compliance gate','terms acceptance and date of birth, for the Play UGC requirement']
  ];
  function present(k){
    var v=RAW? RAW[k] : null;
    if(v==null) return false;
    if(Array.isArray(v)) return v.length>0;
    if(typeof v==='object') return Object.keys(v).length>0;
    return true;
  }
  function badgeFor(k){return present(k)? '' : '<span class="badge">not yet reported</span>';}
  function pendingHtml(k){
    var what='this panel', i;
    for(i=0;i<V2_KEYS.length;i++) if(V2_KEYS[i][0]===k) what=V2_KEYS[i][2];
    return '<div class="pending">'+
      '<div class="pl">Not yet reported</div>'+
      '<div class="pb">This panel shows '+esc(what)+'.</div>'+
      '<div class="pn">It is waiting on the <code>'+esc(k)+'</code> key from <code>analytics_snapshot()</code>. '+
        'The page is already built for it and fills in by itself on the next refresh after the SQL ships.</div>'+
    '</div>';
  }
  function verdictHtml(tone, html){
    return '<div class="verdict'+(tone?' '+tone:'')+'"><span class="vd"></span><span>'+html+'</span></div>';
  }
  function stack(node){var d=h('<div class="stack"></div>');d.appendChild(node);return d;}

  // SWITCHED-OFF FEATURES ARE NOT REPORTED ON (Charbel, 2026-11-20). Rep Calls
  // (REP_CALLS_ENABLED=false, sunset 2026-11-17) and Rivalry + mocks
  // (RIVALRY_ENABLED=false since 2026-07-05) can never produce new data, so a
  // counter for them is noise at best and a phantom roadmap at worst. If the SQL
  // ever ships a row for one, it is dropped here rather than displayed.
  // NOTE: nudges are NOT in this list — still live, barely used (12 ever), and
  // that number is exactly the kind of insight the feature table exists for.
  var KILLED=/^(rep_?calls?|rivalry|mock)/i;
  function alive(k){return !KILLED.test(String(k==null?'':k));}
  function dropKilled(list, field){
    return (Array.isArray(list)? list : []).filter(function(x){return alive(x && x[field]);});
  }

  // A section that throws must not take the page down with it — the snapshot
  // shape is not under this file's control.
  function safe(fn, label){
    try{ return fn(); }
    catch(e){
      return h('<div class="pending anim"><div class="pl">Could not render</div>'+
        '<div class="pb">'+esc(label)+' hit an error while rendering: '+esc(String((e&&e.message)||e))+'</div>'+
        '<div class="pn">The rest of the page is unaffected. This almost always means the snapshot shipped a shape '+
        'this panel did not expect.</div></div>');
    }
  }

  // The eight ranked questions, in priority order. `v` is the verdict builder —
  // the same one the section renders, so the briefing at the top of the page and
  // the section itself can never disagree.
  var QUESTIONS=[
    {id:'q-arrival', key:'arrival',       name:'Arrival shape',   v:vArrival},
    {id:'q-invite',  key:'invite_loop',   name:'Invite loop',     v:vInvite},
    {id:'q-shipped', key:'features',      name:'What we shipped', v:vFeatures},
    {id:'q-social',  key:'social_depth',  name:'Social depth',    v:vSocial},
    {id:'q-streaks', key:'streaks',       name:'Streak health',   v:vStreaks},
    {id:'q-proof',   key:'verification',  name:'Proof',           v:vVerify},
    {id:'q-notify',  key:'notifications', name:'Notifications',   v:vNotify},
    {id:'q-comply',  key:'compliance',    name:'Compliance gate', v:vCompliance}
  ];

  // THE BRIEFING. One screen that says what is broken, ranked, each row jumping
  // to the evidence. Everything in it is computed from the verdict builders.
  function briefing(){
    var flagged=[], okNames=[], quiet=[], pending=[];
    QUESTIONS.forEach(function(q){
      if(!present(q.key)){ pending.push(q.name); return; }
      var v=null; try{ v=q.v(); }catch(e){ v=null; }
      if(!v){ pending.push(q.name); return; }
      if(v.tone==='bad'||v.tone==='warn') flagged.push({q:q,v:v});
      else if(v.tone==='idle') quiet.push(q.name);       // measurable, but no data in the window
      else okNames.push(q.name);
    });
    flagged.sort(function(a,b){return (a.v.tone==='bad'?0:1)-(b.v.tone==='bad'?0:1);});

    var rows=flagged.map(function(f){
      return '<a class="brow '+f.v.tone+'" href="#'+f.q.id+'">'+
        '<span class="bdot"></span>'+
        '<span><span class="bname">'+esc(f.q.name)+'</span> — '+esc(f.v.head)+'</span>'+
        '<span class="bgo" aria-hidden="true">›</span></a>';
    }).join('');

    if(!rows){
      rows='<div class="brow" style="border-bottom:0"><span class="bdot" style="background:var(--green)"></span><span>'+
        ((okNames.length||quiet.length)
          ? 'Nothing is flagged — every question that can be read right now reads healthy.'
          : 'Nothing measurable has arrived yet; the eight panels below are waiting on the analytics update.')+
        '</span></div>';
    }
    var foot=[];
    if(okNames.length) foot.push('Reads healthy: '+esc(okNames.join(', '))+'.');
    if(quiet.length)   foot.push('Nothing to read yet: '+esc(quiet.join(', '))+'.');
    if(pending.length) foot.push(pending.length+' not yet reported: '+esc(pending.join(', '))+'.');
    var el=h('<div class="brief anim">'+
      '<div class="ptitle">What needs attention</div>'+rows+
      (foot.length? '<div class="bfoot">'+foot.join(' ')+'</div>' : '')+
    '</div>');
    // Each row points into a folded group. Unfold it, then scroll — a bare anchor
    // to a display:none target does nothing at all.
    el.addEventListener('click',function(e){
      var a=e.target.closest('a.brow'); if(!a) return;
      var href=a.getAttribute('href')||'';
      if(href.charAt(0)!=='#') return;
      e.preventDefault();
      if(location.hash!==href){ try{ history.replaceState(null,'',href); }catch(err){} }
      revealTarget(href);
    });
    return el;
  }


  // ——— card variants that obey the honest-rate rule ————————————————
  // rateCard: the RATE is the headline (share questions).
  function rateCard(label, num, den, note){
    var r=rate(num,den);
    var val=r.ok? esc(r.text) : '<span class="thin">'+esc(r.text)+'</span>';
    var sub='<span class="'+(r.ok?'base':'warnbase')+'">'+esc(r.base)+'</span>'+(note?' · '+esc(note):'');
    return kpiCard(label,val,sub);
  }
  // shareCard: the COUNT is the headline, the rate rides along underneath.
  function shareCard(label, num, den, note){
    var r=rate(num,den);
    var sub=r.ok? '<span class="base">'+r.text+' of '+fmt(den)+'</span>' : '<span class="warnbase">'+esc(r.base)+'</span>';
    return kpiCard(label, fmt(num), sub+(note?' · '+esc(note):''));
  }
  // pctCard: the snapshot sends a RATE with no count. We print the rate, name
  // the base, and mark the derived count with ≈ so it is never read as measured.
  function pctCard(label, pct, den, note){
    pct=n(pct); den=n(den);
    var tail=note? ' · '+esc(note) : '';
    if(den<=0) return kpiCard(label,'<span class="thin">—</span>','<span class="warnbase">no base to measure against</span>'+tail);
    if(den<MIN_BASE) return kpiCard(label,'<span class="thin">≈'+Math.round(pct/100*den)+' of '+fmt(den)+'</span>',
      '<span class="warnbase">base of '+fmt(den)+' — too small for a percentage</span>'+tail);
    return kpiCard(label, fmt(pct)+'%', '<span class="base">≈'+Math.round(pct/100*den)+' of '+fmt(den)+'</span>'+tail);
  }
  // softPctCard: a rate whose base the snapshot never reports. De-emphasised on
  // purpose — an unbacked percentage does not get headline weight on this page.
  function softPctCard(label, pct, why){
    return kpiCard(label,'<span class="thin">'+fmt(n(pct))+'%</span>',
      '<span class="warnbase">no absolute base reported</span>'+(why?' · '+esc(why):''));
  }
  function durCard(label, hrs, sub){
    var t=fmtDur(hrs);
    return t? kpiCard(label, esc(t), sub? '<span class="base">'+esc(sub)+'</span>' : '')
            : kpiCard(label, '<span class="thin">—</span>', '<span class="warnbase">not reported yet</span>');
  }

  // ——— chart primitives ————————————————————————————————————————————
  // Vertical bars in the page's existing .bars idiom. Deliberately CSS text and
  // not SVG text: an SVG label scales with the chart and goes to ~5px on a phone.
  // Bars capped at 72% of the box so the value/label rows never squeeze them.
  function barsHtml(items, cls, gold){
    var max=0; items.forEach(function(x){max=Math.max(max,n(x.v));}); if(max<=0) max=1;
    var thinLabels=items.length>12;
    return '<div class="bars '+(cls||'')+'">'+items.map(function(x,i){
      var hpct=Math.max(2, Math.round(n(x.v)/max*72));
      return '<div class="bar">'+
        '<div class="bv">'+esc(x.vl!=null? x.vl : fmt(x.v))+'</div>'+
        '<div class="fill'+(x.thin?' thinbar':'')+(gold?' gold':'')+'" style="height:'+hpct+'%"></div>'+
        '<div class="bl">'+esc((thinLabels && i%2)? '' : x.l)+'</div>'+
        (x.sl? '<div class="bn">'+esc(x.sl)+'</div>' : '')+
      '</div>';
    }).join('')+'</div>';
  }
  // Proportion bar. The legend carries ABSOLUTES, not shares.
  function splitHtml(parts){
    var tot=0; parts.forEach(function(p){tot+=Math.max(0,n(p.v));});
    if(tot<=0) return '';
    return '<div class="split">'+parts.map(function(p){
        var w=Math.max(0,n(p.v))/tot*100;
        return w>0? '<div style="width:'+w.toFixed(1)+'%;background:'+p.c+'"></div>' : '';
      }).join('')+'</div>'+
      '<div class="splitleg">'+parts.map(function(p){
        return '<span><i style="background:'+p.c+'"></i>'+esc(p.l)+' '+fmt(p.v)+'</span>';
      }).join('')+'</div>';
  }
  // Horizontal ranked rows (reasons, notification types) in the .rowlist idiom.
  function rowBars(items){
    var max=1; items.forEach(function(x){max=Math.max(max,n(x.v));});
    return items.map(function(x){
      return '<div class="frow"><div class="fl"><span>'+esc(x.l)+'</span>'+
        '<span>'+fmt(x.v)+(x.sub? ' · '+esc(x.sub):'')+'</span></div>'+
        '<div class="ft"><div class="ff" style="width:'+Math.round(n(x.v)/max*100)+'%"></div></div></div>';
    }).join('');
  }
  // Inline sparkline. No text inside the SVG, so scaling it to any width is safe.
  function sparkSvg(vals, color){
    if(!vals || !vals.length) return '';
    var W=100,H=28,max=0,i,d='';
    for(i=0;i<vals.length;i++) max=Math.max(max,n(vals[i]));
    if(max<=0) max=1;
    for(i=0;i<vals.length;i++){
      var x=(vals.length<=1)? W/2 : i*(W/(vals.length-1));
      var y=H-1-(H-2)*(n(vals[i])/max);
      d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    }
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
      '<path d="'+d.trim()+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" '+
      'stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
  }
  // Funnel: step, then the conversion INTO the next step. The leaking step is
  // called out in words as well as colour, and gets an outlined empty track.
  function funnelHtml(title, steps, note){
    var base=Math.max(1, n(steps[0].v));
    var leak=leakIndex(steps);
    var out='<div class="panel fun"><div class="ptitle">'+esc(title)+'</div>';
    for(var i=0;i<steps.length;i++){
      if(i>0){
        var p=n(steps[i-1].v), c=n(steps[i].v), isLeak=(i===leak), txt;
        if(p<=0) txt='nothing reached this step';
        else if(c<=0) txt='<b>leak</b> 0 of '+fmt(p)+' got through';
        else {
          var r=rate(c,p);
          txt=(r.ok? r.text+' got through · '+esc(r.base) : esc(r.text)+' got through — base too small to rate');
          if(isLeak) txt='<b>biggest drop</b> '+txt;
        }
        out+='<div class="conv'+(isLeak?' leak':'')+'"><span class="ar">↓</span>'+txt+'</div>';
      }
      var v=n(steps[i].v), w=Math.round(v/base*100);
      out+='<div class="step"><span class="sl">'+esc(steps[i].l)+'</span><b>'+fmt(v)+'</b></div>'+
        '<div class="trk'+((i===leak && v<=0)?' out':'')+'">'+(w>0? '<div class="fl2" style="width:'+Math.max(1,w)+'%"></div>':'')+'</div>';
    }
    if(note) out+='<div class="subnote">'+esc(note)+'</div>';
    return out+'</div>';
  }

  // ——— Q1 · ARRIVAL SHAPE ——————————————————————————————————————————
  // The activation problem, measured 2026-11-14: 29 of 70 arrived alone and
  // never asked anyone, and friends CAUSE check-ins (9 → 65 within-user).
  function vArrival(){
    if(!present('arrival')) return null;
    var a=RAW.arrival, users=n((RAW.totals||{}).users);
    var alone=n(a.alone_30d), withf=n(a.with_friend_30d), base=alone+withf;
    var never=n(a.never_added_anyone);
    var sq=Array.isArray(a.by_squad)? a.by_squad : [];
    var zero=null, best=null;
    sq.forEach(function(b){
      if(String(b.squad)==='0') zero=b;
      if(n(b.users)>0 && (!best || n(b.checkins_per_user)>n(best.checkins_per_user))) best=b;
    });
    var ar=rate(alone, base), tone, head, say;
    if(base<=0){
      tone='idle';
      head='no arrivals in the last 30 days';
      say='Nobody arrived in the last 30 days, so there is no arrival shape to read.';
      if(users>0) say+=' All time, <b>'+fmt(never)+' of '+fmt(users)+'</b> users have never added a single friend.';
    } else {
      tone=(ar.pct>=50)?'bad':(ar.pct>=25)?'warn':'ok';
      head=(ar.ok? ar.text+' of recent arrivals' : ar.text+' recent arrivals')+' came in alone';
      say=ar.ok
        ? '<b>'+ar.text+' of the people who arrived in the last 30 days arrived alone</b> ('+esc(ar.base)+').'
        : '<b>'+esc(ar.text)+' recent arrivals came in alone</b> — too few arrivals to put a percentage on.';
      if(users>0) say+=' All time, '+fmt(never)+' of '+fmt(users)+' users have never added anyone.';
    }
    if(zero && best && best!==zero && n(best.checkins_per_user)>0){
      say+=' A user with '+esc(String(best.squad))+' friends averages <b>'+fmt(best.checkins_per_user)+
        '</b> check-ins against '+fmt(zero.checkins_per_user)+' for a user with none — friends are what cause check-ins, '+
        'so an arrival with nobody to show up for is the whole activation problem.';
    }
    return {tone:tone, head:head, html:say,
      d:{a:a, users:users, alone:alone, withf:withf, base:base, never:never, sq:sq}};
  }
  function arrivalSection(){
    var el=h('<div class="anim"></div>');
    var v=vArrival();
    // Without the new key the activation funnel still belongs here — it is built
    // from `funnel`, which the snapshot has always carried.
    if(!v){
      el.innerHTML=pendingHtml('arrival')+'<div class="stack">'+activationFunnelHtml()+'</div>';
      return el;
    }
    var d=v.d, squad;
    if(d.sq.length){
      var items=d.sq.map(function(b){
        var u=n(b.users);
        return {l:String(b.squad==null?'?':b.squad), v:n(b.checkins_per_user), vl:fmt(b.checkins_per_user),
                sl:plural(u,'user','users'), thin:u<MIN_BASE};
      });
      squad='<div class="panel"><div class="ptitle">Check-ins per user, by squad size</div>'+
        barsHtml(items,'tall')+
        '<div class="subnote">Each bar is one friend-count bucket; the number under it is how many users are in it. '+
        'Hatched bars sit on fewer than '+MIN_BASE+' users — read them as a direction, not a number.</div></div>';
    } else {
      squad='<div class="panel"><div class="ptitle">Check-ins per user, by squad size</div>'+
        '<div class="subnote">The squad-size breakdown (<code>arrival.by_squad</code>) is not in this snapshot yet.</div></div>';
    }
    el.innerHTML=verdictHtml(v.tone,v.html)+
      '<div class="grid">'+
        rateCard('Arrived alone · 30d', d.alone, d.base)+
        rateCard('Arrived with a friend · 30d', d.withf, d.base)+
        shareCard('Never added anyone', d.never, d.users, 'all time')+
        durCard('To first friend', d.a.median_hours_to_first_friend, 'median, from signup')+
        durCard('To first check-in', d.a.median_hours_to_first_checkin, 'median, from signup')+
      '</div>'+
      '<div class="two stack">'+activationFunnelHtml()+squad+'</div>';
    return el;
  }

  // The signup → activation funnel, all time. Lives here because it IS the
  // arrival story (it used to sit next to the emoji leaderboard, which answered
  // a different question). Same four numbers as before, plus the drop between them.
  function activationFunnelHtml(){
    var f=RAW.funnel||{};
    return funnelHtml('Signup to activated · all time', [
      {l:'Signed up',      v:n(f.signed_up)},
      {l:'Added a friend', v:n(f.added_friend)},
      {l:'First check-in', v:n(f.first_check_in)},
      {l:'Activated',      v:n(f.activated)}
    ], 'Activated = has a friend AND has checked in. The order of the middle two steps is not causal; friending and '+
       'first check-in can happen either way round.');
  }

  // ——— Q2 · INVITE LOOP ————————————————————————————————————————————
  function vInvite(){
    if(!present('invite_loop')) return null;
    var il=RAW.invite_loop, at=il.all_time||{}, tot=RAW.totals||{};
    var steps=[
      {l:'Invite sent',     v:n(il.sent_30d)},
      {l:'Link clicked',    v:n(il.clicks_30d)},
      {l:'Signed up',       v:n(il.signups_30d)},
      {l:'Connected to the inviter', v:n(il.connected_30d)},
      {l:'First check-in',  v:n(il.first_checkin_30d)}
    ];
    var ats=n(at.sent), atk=n(at.clicks), atc=n(at.connects), fr=n(tot.friendships);
    // `claimed` counts the installs where referral-claim DID resolve an inviter
    // (the client's `referral_connected` event). `connects` counts ledger rows.
    // The two disagreeing is the single most informative thing on this page, and
    // reading only `connects` is how this panel spent a week saying the link was
    // dead when it was the write after the link that was failing. See below.
    var atcl=n(at.claimed);
    var leak=leakIndex(steps), tone, head, say;

    if(atc<=0 && atcl>0){
      // THE 42702 ERA. referral_connect() raised on every call from the day it was
      // written until 2026-11-20 (a PL/pgSQL variable named `inviter` colliding with
      // referral_connects.inviter), so referral-claim fell back to a PENDING friend
      // request and the ledger row was never written. The link resolved an inviter
      // atcl times; the warm accepted landing happened zero times.
      tone='warn';
      head=fmt(atcl)+' installs matched an inviter, but the connect was broken until 20 Nov';
      say='<b>The link works; the step after it was broken.</b> '+fmt(atcl)+' installs did resolve '+
          'whoever invited them, and every one of them got a pending friend request instead of the '+
          'accepted-both-ways landing they were supposed to get — <code>referral_connect()</code> raised '+
          'on every call it ever received. <b>Fixed 20 Nov 2026.</b> The ledger reads 0 because nothing '+
          'had ever been able to write to it, so the next referral is the one that proves it.';
      if(fr>0) say+=' Meanwhile '+fmt(fr)+' friend links exist — all made by username or contacts.';
    } else if(atk>0 && atc<=0 && atcl<=0){
      tone='bad';
      head='the link has never connected one person — '+fmt(atk)+' clicks, 0 connections';
      say='<b>The invite link has never connected one person.</b> '+fmt(ats)+' invites produced '+fmt(atk)+
          ' clicks, 0 inviter matches and 0 connections, all time.';
      if(fr>0) say+=' There are '+fmt(fr)+' friend links on the app, so every friendship was made another way — '+
        'by username or contacts. The link is the broken path, not friending itself.';
    } else if(steps[0].v<=0){
      tone='idle';
      head='no invites sent in the last 30 days';
      say='No invites went out in the last 30 days, so the loop has nothing to leak. '+
        (ats>0? 'All time: '+fmt(ats)+' sent, '+fmt(atk)+' clicked, '+fmt(atc)+' connected.' : 'Nothing has ever been sent.');
    } else if(leak>0){
      var L=steps[leak], lr=rate(L.v, steps[leak-1].v);
      tone=(L.v<=0)?'bad':'warn';
      head='leaks hardest at “'+L.l+'” — '+lr.base+' got through';
      say='<b>The loop leaks hardest at “'+esc(L.l)+'”</b> — '+esc(lr.base)+' got through'+(lr.ok? ' ('+lr.text+')':'')+'. '+
          'End to end, '+fmt(steps[4].v)+' of '+fmt(steps[0].v)+' invites reached a first check-in.';
    } else {
      tone='ok';
      head=fmt(steps[4].v)+' of '+fmt(steps[0].v)+' invites reached a first check-in';
      say='Nothing drops between the steps: '+fmt(steps[4].v)+' of '+fmt(steps[0].v)+' invites reached a first check-in.';
    }
    return {tone:tone, head:head, html:say, d:{steps:steps, ats:ats, atk:atk, atc:atc, atcl:atcl, fr:fr}};
  }
  function inviteLoopSection(){
    var el=h('<div class="anim"></div>');
    var v=vInvite();
    // Without the new key, the legacy all-time reach panel is the only invite
    // data there is — so it carries the section on its own.
    if(!v){
      el.innerHTML=pendingHtml('invite_loop');
      el.appendChild(stack(reachFunnel()));
      return el;
    }
    var d=v.d, rc=RAW.reach||{};
    // The legacy `reach` panel repeats "invites sent", which the funnel above now
    // owns. Its two OTHER numbers are kept as a strip rather than a second,
    // possibly disagreeing funnel.
    var legacy='';
    if(present('reach')){
      legacy='<div class="allstrip stack">'+
        '<div><b>'+fmt(rc.friends_added)+'</b>friends added after an invite · all time</div>'+
        '<div><b>'+fmt(rc.first_checkins)+'</b>of those then checked in</div>'+
      '</div>';
    }
    el.innerHTML=verdictHtml(v.tone,v.html)+
      '<div class="two">'+
        funnelHtml('The last 30 days', d.steps,
          'Each step counts people. “Connected to the inviter” means the new account ended up friends with whoever sent the invite.')+
        funnelHtml('The link, all time', [
          {l:'Invites sent', v:d.ats},{l:'Link clicked', v:d.atk},
          {l:'Matched an inviter', v:d.atcl},{l:'Connected', v:d.atc}
        ], '“Matched an inviter” is the app reporting that it found who invited the new account. '+
           '“Connected” is the friendship that was supposed to follow. Those two disagreeing is a '+
           'broken write, not a broken link — it was fixed on 20 Nov 2026.'+
           (d.fr>0? (' For contrast, '+fmt(d.fr)+' friend links exist on the app, made by username or contacts.') : ''))+
      '</div>'+legacy;
    return el;
  }

  // ——— Q3 · WHAT WE SHIPPED ————————————————————————————————————————
  var FEAT_ORDER={dead:0,cold:1,thin:2,cooling:3,fresh:4,live:5};
  var FEAT_PILL={dead:['dead','Dead'],cold:['cold','Stalled'],thin:['cold','One or two people'],
                 cooling:['cold','Cooling'],fresh:['fresh','Just shipped'],live:['live','Live']};
  function featureStatus(f){
    if(f._u<=0) return 'dead';                               // shipped, never used by anyone
    if(f._c<=0) return 'cold';                               // used once, nothing in 30 days
    if(f._days!=null && f._days<14) return 'fresh';
    if(f._u<3) return 'thin';
    return (f._c>=f._p)? 'live' : 'cooling';
  }
  function vFeatures(){
    if(!present('features')) return null;
    var ci30=sum((RAW.daily||[]).slice(-30),'checkins');
    // Switched-off features are dropped before anything is counted.
    var rows=dropKilled(RAW.features,'key').map(function(f){
      var o={key:f.key, label:f.label||f.key, shipped_on:f.shipped_on, attach_pct:f.attach_pct};
      o._u=n(f.users_used); o._c=n(f.uses_30d); o._p=n(f.uses_prev_30d); o._days=daysSince(f.shipped_on);
      o._st=featureStatus(o);
      return o;
    });
    if(!rows.length) return null;
    rows.sort(function(x,y){
      var a=FEAT_ORDER[x._st], b=FEAT_ORDER[y._st];
      if(a!==b) return a-b;
      return y._c-x._c;
    });
    var dead=rows.filter(function(f){return f._st==='dead';});
    var cold=rows.filter(function(f){return f._st==='cold';});
    var tone, head, say;
    if(dead.length){
      tone='bad';
      var oldest=dead.slice().sort(function(x,y){return n(y._days)-n(x._days);})[0];
      head=dead.length+' of '+rows.length+' shipped features have never been used: '+
           dead.map(function(f){return f.label;}).join(', ');
      say='<b>'+dead.length+' of '+rows.length+' things we shipped have never been used once</b>: '+
          esc(dead.map(function(f){return f.label;}).join(', '))+'.';
      if(oldest && oldest._days!=null) say+=' '+esc(oldest.label)+' has been live '+plural(oldest._days,'day','days')+
        ' with zero users — that is a feature nobody found, not a feature nobody wants.';
    } else if(cold.length){
      tone='warn';
      head=cold.length+' features saw no use in the last 30 days: '+cold.map(function(f){return f.label;}).join(', ');
      say='Everything has been used at least once, but <b>'+cold.length+' saw no use in the last 30 days</b>: '+
          esc(cold.map(function(f){return f.label;}).join(', '))+'.';
    } else {
      tone='ok';
      head='every shipped feature saw use in the last 30 days';
      say='Every shipped feature saw use in the last 30 days.';
    }
    return {tone:tone, head:head, html:say, d:{rows:rows, ci30:ci30}};
  }
  function featuresSection(){
    var el=h('<div class="anim"></div>');
    var v=vFeatures();
    if(!v){ el.innerHTML=pendingHtml('features'); return el; }
    var users=n((RAW.totals||{}).users), rows=v.d.rows, ci30=v.d.ci30;

    var body=rows.map(function(f){
      var pill=FEAT_PILL[f._st]||['','—'], ur=rate(f._u, users), dd=f._c-f._p;
      var arw=(dd===0)? '' : ' <span class="arw '+(dd>0?'up':'down')+'">'+(dd>0?'▲+':'▼')+fmt(dd)+'</span>';
      var att='<span class="zero">—</span>';
      if(typeof f.attach_pct==='number' && f.attach_pct>0){
        att=(ci30>=MIN_BASE)
          ? fmt(f.attach_pct)+'%<span class="tsub">'+fmt(f._c)+' of '+fmt(ci30)+' check-ins</span>'
          : '<span class="zero">'+fmt(f._c)+' of '+fmt(ci30)+'</span>';
      }
      return '<tr'+(f._st==='dead'? ' class="deadrow"':'')+'>'+
        '<td>'+esc(f.label)+'<span class="tsub">'+(f._days!=null? 'shipped '+plural(f._days,'day','days')+' ago' : 'ship date unknown')+'</span></td>'+
        '<td>'+(f._u? fmt(f._u) : '<span class="zero">0</span>')+
          '<span class="tsub">'+(ur.ok? ur.text+' of users' : 'of '+fmt(users)+' users')+'</span></td>'+
        '<td>'+(f._c? fmt(f._c) : '<span class="zero">0</span>')+arw+'</td>'+
        '<td>'+(f._p? fmt(f._p) : '<span class="zero">0</span>')+'</td>'+
        '<td>'+att+'</td>'+
        '<td class="lcell"><span class="sp '+pill[0]+'"><i></i>'+esc(pill[1])+'</span></td>'+
      '</tr>';
    }).join('');

    el.innerHTML=verdictHtml(v.tone,v.html)+
      '<div class="tablewrap"><table>'+
        '<thead><tr><th>Feature</th><th>Users</th><th>Uses 30d</th><th>Prev 30d</th><th>Attach</th>'+
        '<th style="text-align:left">Status</th></tr></thead><tbody>'+
        (body||'<tr><td colspan="6" style="text-align:center;color:var(--muted)">No features reported.</td></tr>')+
      '</tbody></table></div>'+
      '<div class="subnote">Sorted worst first. Attach = the share of the last 30 days of check-ins that carried the feature, '+
        'as reported by the snapshot; “—” where it does not apply. Status is computed here: Dead = nobody has ever used it · '+
        'Stalled = used once, nothing in 30 days · Cooling = down on the previous 30 days. '+
        'Features switched off in the app are excluded — they cannot produce new data.</div>';
    return el;
  }

  // ——— Q4 · SOCIAL DEPTH ———————————————————————————————————————————
  function vSocial(){
    if(!present('social_depth')) return null;
    var s=RAW.social_depth;
    var giv=n(s.givers_7d), rec=n(s.receivers_7d), top=n(s.top_giver_share_pct);
    var rpp=n(s.reactions_per_post), cpp=n(s.comments_per_post);
    var tone, head, say;
    if(giv<=0 && rec<=0){
      tone='idle'; head='nobody gave or received anything this week';
      say='Nobody gave or received a reaction in the last 7 days, so there is no depth to read.';
    } else if(giv<3){
      tone='warn';
      head='only '+plural(giv,'person','people')+' gave anything this week';
      say='<b>'+plural(giv,'person','people')+' gave anything in the last 7 days</b> — far too few to call engagement '+
          'broad or narrow. Read everything below as directional.';
    } else if(top>=50){
      tone='bad';
      head='one person is '+fmt(top)+'% of everything given this week';
      say='<b>One person is '+fmt(top)+'% of everything given this week.</b> '+fmt(giv)+' people gave, '+fmt(rec)+
          ' received — engagement is carried, not broad.';
    } else {
      tone='ok';
      head=fmt(giv)+' people gave, '+fmt(rec)+' received';
      say='<b>'+fmt(giv)+' people gave something this week</b> and '+fmt(rec)+' received it; the biggest single giver is '+
          fmt(top)+'% of the total.';
    }
    if(rpp>0 || cpp>0) say+=' Per post it is '+fmt(rpp)+' reactions against '+fmt(cpp)+
      ' comments — people tap far more readily than they type.';
    return {tone:tone, head:head, html:say, d:{s:s, giv:giv, rec:rec, top:top, rpp:rpp, cpp:cpp}};
  }

    var el=h('<div class="anim"></div>');

  // ——— Q5 · STREAK HEALTH ——————————————————————————————————————————
  function vStreaks(){
    if(!present('streaks')) return null;
    var s=RAW.streaks, users=n((RAW.totals||{}).users);
    var alive=n(s.alive), risk=n(s.at_risk), broke=n(s.broken_7d), vac=n(s.on_vacation);
    var tone, head, say;

      head='not one flame is currently alive';
      say='<b>Not one flame is currently alive.</b>'+(broke>0? ' '+plural(broke,'streak','streaks')+' broke in the last 7 days.':'');
    } else if(risk>alive){
      tone='warn';
      head=fmt(risk)+' flames at risk against '+fmt(alive)+' alive';
      say='<b>'+fmt(risk)+' flames are at risk against '+fmt(alive)+' comfortably alive</b> — most live streaks need one more '+
          'workout this week.'+(broke>0? ' '+plural(broke,'streak','streaks')+' already broke in the last 7 days.':'')+' This is the week to nudge.';
    } else {
      tone='ok';
      head=fmt(alive)+' flames alive, '+fmt(risk)+' at risk';
      say='<b>'+fmt(alive)+' flames are alive</b> and '+fmt(risk)+' at risk'+(broke>0? ', '+fmt(broke)+' broke in the last 7 days':'')+

  // ——— Q6 · VERIFICATION ———————————————————————————————————————————
  var REASON_LABEL={no_place:'No venue matched the GPS fix',too_far:'Too far from any known venue',
    no_location:'Location was off or denied',below_bar:'Workout stayed below the effort bar',
    no_media:'No photo or video attached',pending:'Still waiting on a fix',unknown:'Reason not recorded'};
  // hasOwnProperty, not a bare lookup: these keys come from the database, and a
  // row called "constructor" would otherwise resolve to a function.
  function dictLabel(dict, k){
    var s=String(k==null? '' : k);
    return Object.prototype.hasOwnProperty.call(dict, s)? dict[s] : (s? s.replace(/_/g,' ') : 'unknown');
  }
  function reasonLabel(k){return dictLabel(REASON_LABEL, k);}
  function vVerify(){
    if(!present('verification')) return null;
    var vk=RAW.verification;
    var ci30=sum((RAW.daily||[]).slice(-30),'checkins');
    var unv=n(vk.unverified_30d), ver=Math.max(0, ci30-unv);
    var reasons=(Array.isArray(vk.reasons)? vk.reasons : []).slice().sort(function(a,b){return n(b.n)-n(a.n);});
    var r=rate(ver, ci30), rep=n(vk.verified_pct_30d);
    var tone, head, say;
    if(ci30<=0){
      tone='idle';
      head='no check-ins in the last 30 days';
      say='No check-ins in the last 30 days, so there is nothing to verify.'+
          (rep>0? ' The snapshot still reports '+fmt(rep)+'% verified over its own window.' : '');
    } else {
      tone=(r.pct>=90)?'ok':(r.pct>=70)?'warn':'bad';
      head=r.text+' of recent check-ins are verified';
      say=r.ok? '<b>'+r.text+' of the last 30 days of check-ins are verified</b> ('+esc(r.base)+').'
              : '<b>'+esc(r.text)+' of the last 30 days of check-ins are verified</b> — too few to put a percentage on.';
      if(unv>0 && reasons.length) say+=' The main reason the rest are not: '+esc(reasonLabel(reasons[0].reason))+
        ' ('+fmt(reasons[0].n)+' of '+fmt(unv)+').';
      else if(unv>0) say+=' '+fmt(unv)+' are unverified and the snapshot does not say why.';
      else say+=' Nothing went unverified.';
    }
    return {tone:tone, head:head, html:say, d:{ci30:ci30, unv:unv, ver:ver, reasons:reasons, r:r, rep:rep}};
  }
  function verificationSection(){
    var el=h('<div class="anim"></div>');
    var v=vVerify();
    if(!v){ el.innerHTML=pendingHtml('verification'); return el; }
    var d=v.d;
    var drift=(d.ci30>0 && d.rep>0 && Math.abs(d.rep-n(d.r.pct))>5)
      ? '<div class="subnote">The snapshot reports '+fmt(d.rep)+'% over its own 30-day window; this panel computes '+
        Math.round(n(d.r.pct))+'% from the daily series. If they keep diverging, trust the snapshot and check the window.</div>' : '';
    var rpanel=d.reasons.length
      ? '<div class="panel rowlist stack"><div class="ptitle">Why a check-in stayed unverified · 30d</div>'+
        rowBars(d.reasons.map(function(x){
          var rr=rate(x.n, d.unv);
          return {l:reasonLabel(x.reason), v:n(x.n), sub:rr.ok? rr.text+' of unverified' : null};
        }))+'</div>'
      : '<div class="panel stack"><div class="ptitle">Why a check-in stayed unverified</div>'+
        '<div class="subnote">'+(d.unv>0? 'The reason breakdown (<code>verification.reasons</code>) is not in this snapshot yet.'
                                        : 'Nothing to explain — no unverified check-ins in the window.')+'</div></div>';
    el.innerHTML=verdictHtml(v.tone,v.html)+
      '<div class="grid">'+
        rateCard('Verified · last 30 days', d.ver, d.ci30)+
        shareCard('Unverified · last 30 days', d.unv, d.ci30, 'of all check-ins')+
        kpiCard('Check-ins measured', fmt(d.ci30), '<span class="base">last 30 days of the daily series</span>')+
      '</div>'+drift+rpanel;
    return el;
  }

  // ——— Q7 · NOTIFICATIONS ——————————————————————————————————————————
  var NOTE_LABEL={reaction:'Reaction on your proof',comment:'Comment on your proof',friend_checkin:'A friend worked out',

    tag:'You were tagged',meal:'Meal posted',invite:'Invite',pr:'Personal record'};

  function vNotify(){

          (types.length? ', led by '+esc(noteLabel(types[0].type))+' ('+fmt(types[0].n)+')' : '')+'. '+
          (tr.ok? tr.text+' of users can receive a push ('+esc(tr.base)+').' : esc(tr.base)+' can receive a push.');
    }
    say+=' <b>Whether any of them get tapped is still not measured</b> — the snapshot sends volume, not opens, so the '+
         'routing that shipped in 1.3.0 is still unproven.';

  // ——— Q8 · COMPLIANCE —————————————————————————————————————————————
  function vCompliance(){
    if(!present('compliance')) return null;
    var c=RAW.compliance, users=n((RAW.totals||{}).users);
    var ta=n(c.terms_accepted), dob=n(c.dob_present), adult=n(c.adult_confirmed);

          'on a user-generated-content app to have accepted them and to carry a date of birth; '+fmt(dob)+' have one on file.';
      if(ta<=5) say+=' A number this low usually means the gate only runs for new signups and older accounts were never asked.';

  // ——— the newer per-day series ————————————————————————————————————
  // daily[] gains meals / comments / tags / music / invites / clicks. An absent
  // field would sum to a confident zero, so we only render what is actually there.
  function sparksStrip(cur, prev){
    var keys=NEW_DAILY.filter(function(k){return dailyHasKey(RAW.daily,k);});
    if(!keys.length){
      return h('<div class="pending anim">'+
        '<div class="pl">Not yet reported</div>'+
        '<div class="pb">Six newer per-day series — comments, meals, music, tags, invites and link clicks — are not in '+
          'this snapshot yet.</div>'+
        '<div class="pn">They appear here, as chips on the trend chart and as columns in the day-by-day table the moment '+
          '<code>daily[]</code> carries them.</div></div>');
    }
    var el=h('<div class="sparks anim"></div>');
    el.innerHTML=keys.map(function(k){
      var m=metricByKey(k), c=sum(cur,k), p=sum(prev,k);
      return '<div class="spark"><div class="sl">'+esc(m.label)+'</div>'+
        '<div class="sv">'+fmt(c)+'</div>'+
        '<div class="sd">'+deltaHtml(c,p)+'</div>'+
        sparkSvg(cur.map(function(r){return n(r[k]);}), m.color)+
      '</div>';
    }).join('');
    return el;
  }

  // Unique users split by device platform (iOS / Android / Web), from the
  // analytics_events.platform the app stamps on every event. all-time headline
  // per platform + a 7-day-active sub, plus a proportion bar. Reads RAW.platforms;
  // if the backend hasn't shipped that field yet, everything reads a graceful 0.
  function platformSplit(){
    var p=RAW.platforms||{};
    var ios=n(p.ios), andr=n(p.android), web=n(p.web), tot=n(p.total);
    var base=Math.max(1, ios+andr+web);
    function share(v){return Math.round(n(v)/base*100)+'%';}
    var el=h('<div class="anim"></div>');
    var cards='<div class="grid" style="margin-bottom:12px">'+
      kpiCard('iOS users', fmt(ios), share(ios)+' · '+fmt(n(p.ios_7d))+' active 7d')+
      kpiCard('Android users', fmt(andr), share(andr)+' · '+fmt(n(p.android_7d))+' active 7d')+
      (web>0? kpiCard('Web users', fmt(web), share(web)) : '')+
      kpiCard('Unique users', fmt(tot), 'distinct across all platforms')+
    '</div>';
    function seg(v,c){var w=Math.round(n(v)/base*100);return w>0?'<div style="width:'+w+'%;background:'+c+'"></div>':'';}
    function leg(c,label,v){return '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:'+c+';display:inline-block"></i>'+label+' '+share(v)+'</span>';}
    var bar='<div class="allstrip" style="display:block">'+
      '<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--edge2)">'+
        seg(ios,'var(--orange)')+seg(andr,'var(--green)')+seg(web,'var(--blue)')+
      '</div>'+
      '<div style="display:flex;gap:16px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap">'+
        leg('var(--orange)','iOS',ios)+leg('var(--green)','Android',andr)+(web>0?leg('var(--blue)','Web',web):'')+
      '</div></div>';
    el.innerHTML=cards+bar;
    return el;
  }

  // DAU / WAU / MAU (unique openers) + the DAU÷WAU stickiness ratio.
  // The ratio now goes through the honest-rate rule: "30%" off a WAU of 7 was
  // exactly the confident-percentage-on-a-tiny-base problem this page exists to stop.
  function stickiness(){
    var s=RAW.stickiness||{};
    var el=h('<div class="grid anim"></div>');
    el.innerHTML=
      kpiCard('DAU', fmt(n(s.dau)), 'unique openers today')+
      kpiCard('WAU', fmt(n(s.wau)), 'unique openers · 7d')+
      kpiCard('MAU', fmt(n(s.mau)), 'unique openers · 30d')+
      rateCard('Stickiness', n(s.dau), n(s.wau), 'DAU ÷ WAU · higher = more habitual');
    return el;
  }

  // Invite loop, all-time: invites sent -> friends added -> first check-ins.
  function reachFunnel(){
    var rc=RAW.reach||{};
    var steps=[['Invites sent',n(rc.invites_sent)],['Friends added',n(rc.friends_added)],['First check-ins',n(rc.first_checkins)]];
    var base=Math.max(1, steps[0][1]);
    var el=h('<div class="panel rowlist anim"></div>');
    el.innerHTML='<div class="cl" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:12px">Invite reach (all-time)</div>'+
      steps.map(function(s){var w=Math.round(s[1]/base*100);
        return '<div class="frow"><div class="fl"><span>'+esc(s[0])+'</span><span>'+s[1]+'</span></div><div class="ft"><div class="ff" style="width:'+w+'%"></div></div></div>';
      }).join('');
    return el;
  }

  // Retention curve: % of a signup cohort back N weeks later, offsets 1..6.
  function retentionCurve(){
    var rc=RAW.retention_curve||[];
    var body=rc.length? rc.map(function(x){var p=n(x.pct);
      return '<div class="frow"><div class="fl"><span>Week +'+n(x.offset)+'</span><span>'+fmt(p)+'%</span></div><div class="ft"><div class="ff" style="width:'+Math.min(100,Math.max(0,p))+'%"></div></div></div>';
    }).join('') : '<div style="color:var(--muted);font-size:13px">Not enough cohort history yet.</div>';
    var el=h('<div class="panel rowlist anim" style="margin-top:12px"></div>');
    el.innerHTML='<div class="ptitle">Retention curve — % back N weeks after signup</div>'+body+
      '<div class="subnote">The snapshot sends these as rates without the cohort sizes behind them. On a user base this '+
      'small one or two people move a whole week, so read the shape, not the numbers.</div>';
    return el;
  }

  // Unique openers by platform, over the selected range — iOS vs Android lines.
  function platformTrend(cur){
    var rows=cur.slice();
    var W=840,H=200,PL=40,PR=12,PT=14,PB=24, plotW=W-PL-PR, plotH=H-PT-PB, cnt=rows.length;
    var ios=rows.map(function(r){return n(r.openers_ios);});
    var andr=rows.map(function(r){return n(r.openers_android);});
    var maxV=Math.max(1, Math.max.apply(null, ios.concat(andr)));
    function X(i){return cnt<=1?PL+plotW/2:PL+i*(plotW/(cnt-1));}
    function Y(v){return PT+plotH*(1-v/maxV);}
    function path(vals){var d='';for(var i=0;i<vals.length;i++){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1)+' ';}return d.trim();}
    var grid='';for(var t=0;t<=3;t++){var gy=PT+plotH*t/3;
      grid+='<line class="grid-l" x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'"/>'+
        '<text class="axis-t" x="'+(PL-6)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end">'+fmt(maxV*(1-t/3))+'</text>';}
    var el=h('<div class="panel" style="margin-top:12px"></div>');
    el.innerHTML='<div class="cl" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:8px">Unique openers by platform — over time</div>'+
      '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Unique openers by platform over time">'+grid+
        '<path class="linep" d="'+path(ios)+'" stroke="var(--orange)"/>'+
        '<path class="linep" d="'+path(andr)+'" stroke="var(--green)"/>'+
      '</svg>'+
      '<div class="legend"><span><i style="border-top-color:var(--orange)"></i>iOS</span><span><i style="border-top-color:var(--green)"></i>Android</span></div>';
    return el;
  }

  // ===================================================================
  // Users — the owner-only roster (PII). Lazy-fetched ONCE from the same
  // key-gated function with ?view=users, rendered as a table. Best-effort:
  // any failure shows a quiet inline note and NEVER breaks the dashboard.
  // ===================================================================
  var USERS=null, USERS_ERR=null, usersLoading=false;

  function usersPanel(){ return h('<div id="usersBox" class="anim"></div>'); }

  function paintUsers(){
    var box=document.getElementById('usersBox'); if(!box) return;
    if(USERS_ERR){
      box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px 2px">Couldn’t load the user list ('+esc(USERS_ERR)+'). The rest of the dashboard is unaffected.</div>';
      return;
    }
    if(USERS===null){
      box.innerHTML='<div style="color:var(--muted2);font-size:13px;padding:8px 2px">Loading users…</div>';
      return;
    }
    var all=USERS.slice();
    var real=all.filter(function(u){return !u.is_test;});
    var hide=state.usersHideTest!==false;                 // default: hide test/review
    var rows=hide? real : all;
    var head='<thead><tr>'+
        '<th>Name / handle</th>'+
        '<th style="text-align:left">Email</th>'+
        '<th>Joined</th>'+
        '<th>Check-ins</th>'+
        '<th>Friends</th>'+
        '<th>Push</th>'+
      '</tr></thead>';
    var body=rows.map(function(u){
      var dn=u.display_name? esc(u.display_name) : (u.username? '@'+esc(u.username) : '—');
      var handle=(u.display_name && u.username)? ' <span style="color:var(--muted2);font-weight:500">@'+esc(u.username)+'</span>' : '';
      var tag=u.is_test? ' <span style="color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--edge);border-radius:5px;padding:1px 5px;margin-left:6px">test</span>' : '';
      var push=u.has_token? '<span class="up">✓</span>' : '<span class="zero">–</span>';
      return '<tr>'+
        '<td>'+dn+handle+tag+'</td>'+
        '<td style="text-align:left;color:var(--muted);white-space:normal">'+esc(u.email||'—')+'</td>'+
        '<td>'+(u.joined? esc(fmtDate(u.joined)) : '—')+'</td>'+
        '<td>'+fmt(u.checkins)+'</td>'+
        '<td>'+fmt(u.friends)+'</td>'+
        '<td>'+push+'</td>'+
      '</tr>';
    }).join('');
    box.innerHTML=
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">'+
        '<span class="hint" style="color:var(--muted2);font-size:12px">showing '+real.length+' real of '+all.length+'</span>'+
        '<button class="toggle" id="usersTestToggle" aria-pressed="'+hide+'"><span class="sw"></span><span class="tt">Hide test / review</span></button>'+
      '</div>'+
      '<div class="tablewrap"><table>'+head+'<tbody>'+
        (body||'<tr><td colspan="6" style="text-align:center;color:var(--muted)">No users to show.</td></tr>')+
      '</tbody></table></div>';
    var tg=box.querySelector('#usersTestToggle');
    if(tg) tg.addEventListener('click',function(){
      state.usersHideTest = !(state.usersHideTest!==false);
      saveState(); paintUsers();
    });
  }

  function ensureUsers(){
    paintUsers();                                         // paint current state first
    if(USERS!==null || USERS_ERR!==null || usersLoading) return;
    usersLoading=true;
    fetch(FN+'?view=users&key='+encodeURIComponent(KEY),{cache:'no-store'})
      .then(function(res){
        if(res.status===401){ USERS_ERR='unauthorized'; return null; }
        if(!res.ok){ USERS_ERR='HTTP '+res.status; return null; }
        return res.json();
      })
      .then(function(data){ if(data!=null) USERS=Array.isArray(data)? data : []; })
      .catch(function(){ USERS_ERR='network error'; })
      .finally(function(){ usersLoading=false; paintUsers(); });
  }

  // ===================================================================
  // Capacity & limits — backend usage vs the Free-plan ceilings. Lazy-fetched
  // ONCE from the same key-gated function with ?view=limits (PII-free: bytes +
  // counts only). Best-effort: any failure shows a quiet note, never breaks the page.
  // ===================================================================
  var LIMITS=null, LIMITS_ERR=null, capLoading=false;
  // Free-tier ceilings (the plan facts live here, not in the DB).
  var CEIL={storage:1073741824, db:524288000, egress:5368709120};

  function capacityPanel(){ return h('<div id="capBox" class="anim"></div>'); }

  function meterRow(label, used, ceil, note){
    var pct=ceil? Math.min(100, used/ceil*100) : 0;
    var color = pct>=90? '#e5484d' : pct>=70? 'var(--orange)' : '#35D08A';
    return '<div style="margin:0 0 14px">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px">'+
        '<span style="color:var(--ink2);font-weight:700">'+esc(label)+'</span>'+
        '<span style="color:var(--muted);font-variant-numeric:tabular-nums">'+fmtBytes(used)+' / '+fmtBytes(ceil)+' · '+fmt(pct)+'%</span>'+
      '</div>'+
      '<div style="height:8px;border-radius:99px;background:var(--edge2);overflow:hidden">'+
        '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+color+';border-radius:99px"></div>'+
      '</div>'+
      (note? '<div style="color:var(--muted2);font-size:11.5px;margin-top:4px">'+esc(note)+'</div>' : '')+
    '</div>';
  }

  function paintCapacity(){
    var box=document.getElementById('capBox'); if(!box) return;
    if(LIMITS_ERR){ box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px 2px">Couldn’t load capacity ('+esc(LIMITS_ERR)+'). The rest of the dashboard is unaffected.</div>'; return; }
    if(LIMITS===null){ box.innerHTML='<div style="color:var(--muted2);font-size:13px;padding:8px 2px">Loading capacity…</div>'; return; }
    var L=LIMITS, st=L.storage||{}, cm=L.checkin_media||{}, buckets=st.buckets||[];
    var perFile=L.per_file_limit_bytes||52428800;
    var bucketRows=buckets.map(function(b){
      return '<tr><td style="text-align:left">'+esc(b.bucket)+'</td><td>'+fmt(b.objects)+'</td><td>'+fmtBytes(b.bytes)+'</td></tr>';
    }).join('');
    box.innerHTML=
      meterRow('File storage', n(st.total_bytes), CEIL.storage, fmt(n(st.total_objects))+' objects across '+buckets.length+' buckets') +
      meterRow('Database', n(L.db_bytes), CEIL.db, null) +
      '<div style="margin:0 0 14px">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px">'+
          '<span style="color:var(--ink2);font-weight:700">Bandwidth (egress)</span>'+
          '<span style="color:var(--muted);font-variant-numeric:tabular-nums">— / '+fmtBytes(CEIL.egress)+' / mo</span>'+
        '</div>'+
        '<div style="height:8px;border-radius:99px;background:var(--edge2);overflow:hidden"><div style="height:100%;width:0;background:var(--edge)"></div></div>'+
        '<div style="color:var(--muted2);font-size:11.5px;margin-top:4px">Not stored in the database — see <a href="https://supabase.com/dashboard/project/beeglejqrbygnztzqela/reports/storage" target="_blank" rel="noopener" style="color:var(--orange)">Supabase → Reports</a>. This is what video playback consumes; watch it as viewership grows.</div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px">'+
        '<div style="flex:1 1 190px;border:1px solid var(--edge2);border-radius:12px;padding:11px 13px">'+
          '<div style="color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Per-file upload cap</div>'+
          '<div style="color:var(--ink);font-size:18px;font-weight:800;margin-top:3px">'+fmtBytes(perFile)+'</div>'+
          '<div style="color:var(--muted);font-size:11.5px;margin-top:2px">Free-plan hard limit. Check-in videos are capped at capture to stay under it.</div>'+
        '</div>'+
        '<div style="flex:1 1 190px;border:1px solid var(--edge2);border-radius:12px;padding:11px 13px">'+
          '<div style="color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.04em">Orphaned media</div>'+
          '<div style="color:var(--ink);font-size:18px;font-weight:800;margin-top:3px">'+fmt(n(cm.orphan_objects))+' · '+fmtBytes(cm.orphan_bytes)+'</div>'+
          '<div style="color:var(--muted);font-size:11.5px;margin-top:2px">Files no live check-in references — safe to purge.</div>'+
        '</div>'+
      '</div>'+
      '<div class="tablewrap"><table><thead><tr><th style="text-align:left">Bucket</th><th>Objects</th><th>Size</th></tr></thead><tbody>'+
        (bucketRows||'<tr><td colspan="3" style="text-align:center;color:var(--muted)">No objects.</td></tr>')+
      '</tbody></table></div>'+
      '<div style="color:var(--muted2);font-size:11px;margin-top:8px">Plan: Free · ceilings are the Free-tier limits · as of '+esc(L.generated_at? String(L.generated_at).slice(0,16).replace('T',' ') : '—')+' UTC</div>';
  }

  function ensureCapacity(){
    paintCapacity();
    if(LIMITS!==null || LIMITS_ERR!==null || capLoading) return;
    capLoading=true;
    fetch(FN+'?view=limits&key='+encodeURIComponent(KEY),{cache:'no-store'})
      .then(function(res){ if(res.status===401){LIMITS_ERR='unauthorized';return null;} if(!res.ok){LIMITS_ERR='HTTP '+res.status;return null;} return res.json(); })
      .then(function(data){ if(data!=null) LIMITS=data; })
      .catch(function(){ LIMITS_ERR='network error'; })
      .finally(function(){ capLoading=false; paintCapacity(); });
  }

  // ===================================================================
  // Data loading
  // ===================================================================
  var FN='https://beeglejqrbygnztzqela.supabase.co/functions/v1/dashboard';
  function msg(t){document.getElementById('app').innerHTML='<div class="msg">'+esc(t)+'</div>';}

  async function refetch(manual){
    var btn=document.getElementById('refreshBtn'); if(btn&&manual)btn.setAttribute('aria-busy','true');
    try{
      var res=await fetch(FN+'?key='+encodeURIComponent(KEY)+(state.realOnly?'&seed=exclude':''),{cache:'no-store'});
      if(res.status===401){msg('Unauthorized — the key in the URL is missing or wrong.');return;}
      if(!res.ok){if(!RAW)msg('Could not load analytics (HTTP '+res.status+').');return;}
      RAW=await res.json();
      if(!RAW.daily){msg('The analytics backend returned an unexpected shape (no daily series).');return;}
      render();
    }catch(err){ if(!RAW) msg('Network error loading analytics.'); }
    finally{ if(btn)btn.removeAttribute('aria-busy'); }
  }

  (function(){
    KEY=new URLSearchParams(location.search).get('key');
    if(!KEY){msg('Add your dashboard key to the URL:  ?key=…');return;}
    refetch(false);
    timer=setInterval(function(){refetch(false);}, 300000); // 5 min "living" refresh
  })();
  </script>
</body>
</html>
