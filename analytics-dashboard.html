<!doctype html>
<!--
  RepCall — interactive analytics dashboard (first-party, no third-party SDK).
  Host on repcall.app (the RepCall-site / GitHub Pages repo, with the legal pages).
  Open with the secret key in the URL:
      https://repcall.app/analytics-dashboard.html?key=<DASHBOARD_KEY>

  It fetches ONE aggregate snapshot (no PII) from the key-gated Supabase `dashboard`
  function, then does ALL filtering / period-comparison / binning CLIENT-SIDE from the
  180-day `daily[]` series — so range filters and the compare toggle are instant, no
  round-trips. It refetches every 5 min (keeping your filters) so it stays "living".
  The key lives only in your bookmarked URL, never in this file.

  ——— v2, 2026-11-20 — read this before editing ———————————————————————————
  The page answers the eight ranked questions in 02-product/briefs/ANALYTICS-V2-BRIEF.md,
  in that order: arrival shape and the invite loop lead, because that is where the
  product is actually broken.

  It reads top to bottom in four tiers:
    THE READING      key metric + the briefing — what is broken, ranked, each row
                     jumping to the section that proves it.
    THE QUESTIONS    the eight sections, in the brief's priority order. Verdicts live
                     here.
    THE SERIES       volume over time (KPIs, trend, newer signals, day-by-day).
    REFERENCE        habit, retention, timing, platform, users, capacity. Background
                     numbers that need no decision; deliberately last.

  SWITCHED-OFF FEATURES ARE NOT REPORTED ON (Charbel, 2026-11-20): Rep Calls
  (REP_CALLS_ENABLED=false) and Rivalry/mocks (RIVALRY_ENABLED=false) are filtered
  out of `features[]` and `notifications.by_type_7d` by the KILLED regex — they can
  never produce new data, so a counter for them is a phantom roadmap. Nudges STAY:
  still live, barely used, and that is the insight.

  Three rules hold the whole thing together:

  1. GRACEFUL DEGRADATION IS THE CONTRACT. Each new section is driven by one
     top-level snapshot key (`arrival`, `invite_loop`, `features`, `social_depth`,
     `streaks`, `verification`, `notifications`, `compliance`) and the SQL for those
     ships separately. Every section calls present() first and renders a quiet,
     explained "not yet reported" panel — never a crash, a NaN, or a box of zeros.
     Feed this file the pre-v2 snapshot and you get eight placeholders plus the
     entire original dashboard, working. Same for the newer `daily[]` fields
     (meals, comments, tags, music, invites, clicks): dailyHasKey() decides whether
     a chip, a column or a sparkline exists at all.
  2. THE HONEST-RATE RULE. 71 users, 3 meals, 0 reposts — a percentage on a base of
     3 is a lie told confidently. Every rate goes through rate(): the absolute always
     travels with it, and a base under MIN_BASE prints as a raw fraction instead of a
     bold percentage. Derived counts (where the snapshot sends a rate but no count)
     are marked with "≈".
  3. EVERY SECTION STATES A VERDICT. One computed plain-English sentence above the
     numbers, because this page is read by one person who wants a reading, not a
     metric. If you add a panel, write its verdict.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RepCall Analytics</title>
  <style>
    :root{
      --bg:#141010; --bg2:#0f0b09; --card:#211a15; --card2:#1a1410; --edge:#3a2d24; --edge2:#2b211b;
      --ink:#F6EFE8; --ink2:#e3d6ca; --muted:#a8998c; --muted2:#7d7065;
      --orange:#FF5A1F; --orange2:#FF8A3D; --gold:#F5B301;
      --green:#4ade80; --red:#f87171; --blue:#60a5fa; --violet:#c084fc; --pink:#f472b6; --cyan:#22d3ee;
      --shadow:0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:radial-gradient(1200px 600px at 80% -10%, #221812 0%, var(--bg) 55%) fixed, var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 72px}
    a{color:var(--orange2);text-decoration:none}

    /* header */
    .top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px 14px;margin-bottom:18px}
    .brand{font-size:23px;font-weight:900;letter-spacing:-.02em}
    .brand span{color:var(--orange)}
    .top .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .gen{font-size:12px;color:var(--muted)}
    .gen b{color:var(--ink2);font-weight:700}
    .refresh{appearance:none;border:1px solid var(--edge);background:var(--card);color:var(--ink2);
      font:inherit;font-size:12px;font-weight:700;border-radius:9px;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
    .refresh:hover{border-color:var(--orange);color:var(--ink)}
    .refresh[aria-busy="true"]{opacity:.6;pointer-events:none}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.16)}

    /* controls */
    .controls{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
      background:rgba(20,16,16,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      border:1px solid var(--edge2);border-radius:14px;padding:11px 14px;margin-bottom:22px;box-shadow:var(--shadow)}
    .cgroup{display:flex;align-items:center;gap:8px}
    .clabel{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2)}
    .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--edge2);border-radius:10px;padding:3px;gap:2px}
    .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;
      padding:6px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
    .seg button:hover{color:var(--ink2)}
    .seg button[aria-pressed="true"]{background:var(--orange);color:#1a0f08}
    .seg.subtle button[aria-pressed="true"]{background:var(--edge);color:var(--ink)}
    .custom{display:none;align-items:center;gap:8px}
    .custom.show{display:flex}
    .custom input{background:var(--bg2);border:1px solid var(--edge);color:var(--ink);font:inherit;font-size:13px;
      border-radius:9px;padding:6px 9px;color-scheme:dark}
    .custom span{color:var(--muted2);font-size:13px}
    .toggle{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
    .toggle .sw{width:40px;height:23px;border-radius:99px;background:var(--edge);position:relative;transition:background .18s}
    .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#cbb9ab;transition:transform .18s,background .18s}
    .toggle[aria-pressed="true"] .sw{background:var(--orange)}
    .toggle[aria-pressed="true"] .sw::after{transform:translateX(17px);background:#1a0f08}
    .toggle .tt{font-size:13px;font-weight:700;color:var(--ink2)}


    /* section titles */
    .sec{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:26px 2px 13px}
    .sec h2{font-size:13px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:0}
    .sec .hint{font-size:12px;color:var(--muted2)}

    /* kpi cards */
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid var(--edge2);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
    .card .cl{font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
    .card .cv{font-size:29px;font-weight:800;margin-top:7px;letter-spacing:-.01em}
    .card .cs{font-size:12px;margin-top:5px;color:var(--muted)}
    .delta{font-weight:700}
    .up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}

    /* panel + chart */
    .panel{background:var(--card);border:1px solid var(--edge2);border-radius:16px;padding:16px 16px 12px;box-shadow:var(--shadow)}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
    .chip{appearance:none;border:1px solid var(--edge);background:var(--bg2);color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;
      padding:6px 11px;border-radius:99px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,color .15s,background .15s}
    .chip:hover{color:var(--ink2)}
    .chip .sw{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.85}
    .chip[aria-pressed="true"]{color:var(--ink);background:var(--card2)}
    .chartwrap{position:relative;width:100%}
    svg.chart{display:block;width:100%;height:auto;touch-action:pan-y}
    .grid-l{stroke:var(--edge2);stroke-width:1}
    .axis-t{fill:var(--muted2);font-size:11px}
    .area{opacity:.18}
    .linep{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .linec{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5;opacity:.8}
    .guide{stroke:var(--edge);stroke-width:1;opacity:0}
    .cursor{opacity:0}
    .tip{position:absolute;pointer-events:none;transform:translate(-50%,-118%);background:#0c0908;border:1px solid var(--edge);
      border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
    .tip .td{color:var(--muted);font-size:11px;margin-bottom:3px}
    .tip .row{display:flex;align-items:center;gap:7px}
    .tip .row .k{width:8px;height:8px;border-radius:50%}
    .tip b{color:var(--ink);font-weight:800}
    .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 2px 2px}
    .legend i{display:inline-block;width:16px;height:0;border-top:3px solid var(--orange);vertical-align:middle;margin-right:6px;border-radius:2px}
    .legend i.prev{border-top:2px dashed var(--muted)}

    /* table */
    .tablewrap{overflow-x:auto;border:1px solid var(--edge2);border-radius:14px;box-shadow:var(--shadow)}
    table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
    thead th{position:sticky;top:0;background:var(--card2);color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
      font-size:11px;text-align:right;padding:10px 12px;border-bottom:1px solid var(--edge)}
    thead th:first-child{text-align:left}
    tbody td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--edge2);color:var(--ink2);font-variant-numeric:tabular-nums}
    tbody td:first-child{text-align:left;color:var(--ink);font-weight:600;white-space:nowrap}
    tbody tr:hover{background:var(--card2)}
    tbody tr:last-child td{border-bottom:0}
    tfoot td{padding:10px 12px;text-align:right;font-weight:800;color:var(--ink);border-top:2px solid var(--edge);font-variant-numeric:tabular-nums}
    tfoot td:first-child{text-align:left;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
    td .arw{font-size:11px;margin-left:5px}
    .zero{color:var(--muted2)}

    /* bar panels (hourly / dow) */
    .bars{display:flex;gap:3px;align-items:stretch;height:150px;margin-top:4px}
    .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
    .bar .fill{width:82%;max-width:26px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--orange),#b03d0e);min-height:2px;transition:height .3s cubic-bezier(.22,1,.36,1)}
    .bar .bl{font-size:10px;color:var(--muted2);white-space:nowrap}
    .bar.hot .fill{background:linear-gradient(180deg,var(--gold),var(--orange))}

    /* reactions + funnel */
    .rowlist .frow{margin-bottom:11px}
    .rowlist .fl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink2)}
    .rowlist .fl span:last-child{color:var(--muted)}
    .rowlist .ft{background:var(--bg2);border-radius:8px;height:15px;overflow:hidden}
    .rowlist .ff{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:8px;transition:width .35s cubic-bezier(.22,1,.36,1)}
    .emoji-list .fl span:first-child{font-size:16px}

    .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:720px){.two{grid-template-columns:1fr}}

    .allstrip{display:flex;flex-wrap:wrap;gap:10px 26px;padding:14px 18px;background:var(--card2);border:1px solid var(--edge2);border-radius:14px;margin-top:12px}
    .allstrip div{font-size:13px;color:var(--muted)}
    .allstrip b{color:var(--ink);font-weight:800;font-size:18px;display:block;letter-spacing:-.01em}

    .foot{margin-top:34px;font-size:11.5px;color:var(--muted2);line-height:1.6;text-align:center}
    .msg{max-width:640px;margin:90px auto;padding:24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}

    /* entrance motion */
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    /* No fill-mode ON PURPOSE. With `both` the element holds the keyframe's opacity:0
       until the animation runs, so any renderer that doesn't run animations — headless
       capture, print, some embedded viewers — shows a faded or empty page. Without it
       the default state is the visible one and the rise merely decorates the entrance. */
    .anim{animation:rise .45s cubic-bezier(.22,1,.36,1)}
    @media(prefers-reduced-motion:reduce){
      .anim{animation:none}
      .bar .fill,.rowlist .ff,.tip{transition:none}
    }

    /* =================================================================
       v2 — the insight layer (2026-11-20)
       Counters answer "how many". These styles exist to answer "so what":
       a computed verdict per section, an honest-rate treatment that never
       lets a percentage travel without its absolute, and a quiet
       "not yet reported" state for every panel whose SQL hasn't shipped.
       ================================================================= */

    /* VERDICT — one plain-English sentence, computed from the data below it.
       The dot only repeats what the sentence already says (never colour-only). */
    .verdict{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--edge2);
      border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
    .verdict .vd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--muted2)}
    .verdict b{color:var(--ink);font-weight:800}
    .verdict.ok .vd{background:var(--green)}
    .verdict.warn .vd{background:var(--gold)}
    .verdict.bad .vd{background:var(--red)}

    /* NOT YET REPORTED — the snapshot has no key for this panel yet. Quiet,
       explained, never an error and never a box of zeros. */
    /* Explanatory copy here sits at 11–12px, so it uses --muted (6.2:1 on the card)
       and NOT --muted2 (3.6:1) — these sentences have to be readable, not decorative. */
    .pending{border:1px dashed var(--edge);border-radius:14px;padding:14px 15px;background:rgba(255,255,255,.012)}
    .pending .pl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
    .pending .pb{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
    .pending .pn{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;color:var(--ink2)}
    .badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
      border:1px dashed var(--edge);border-radius:99px;padding:2px 8px;white-space:nowrap}
    .subnote{font-size:12px;color:var(--muted);line-height:1.5;padding:6px 2px 2px}

    /* HONEST RATES — a thin base is shown as a raw fraction at a smaller size,
       so it can never be mistaken for a confident percentage. */
    .card .cv .thin,.spark .sv .thin{font-size:21px;font-weight:800;color:var(--ink2)}
    .card .cs .base{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
    .card .cs .warnbase{color:var(--gold);font-weight:700}

    /* FUNNEL — step, then the conversion into the next step, so the leak is
       a line of text as well as a shape. */
    .fun .step{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink2);margin-bottom:6px}
    .fun .step b{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
    .fun .step .sl{font-weight:700}
    .fun .trk{background:var(--bg2);border:1px solid transparent;border-radius:8px;height:16px;overflow:hidden}
    .fun .trk.out{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.07)}
    .fun .fl2{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:8px}
    .fun .conv{font-size:12px;color:var(--muted);padding:7px 0 9px 15px;line-height:1.45}
    .fun .conv .ar{color:var(--muted2);margin-right:7px}
    .fun .conv.leak{color:#fca5a5}
    .fun .conv.leak b{color:#fca5a5;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;margin-right:6px}

    /* labelled bars — extends the existing .bars idiom with a value above and a
       base below. CSS text, not SVG text, so it stays legible on a phone. */
    .bars.tall{height:220px}
    .bar .bv{font-size:11.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
    .bar .bn{font-size:10px;color:var(--muted2);white-space:nowrap}
    .bar .fill.thinbar{background:repeating-linear-gradient(45deg,var(--card2) 0 3px,rgba(255,90,31,.5) 3px 7px);border:1px solid var(--edge)}
    .bar .fill.gold{background:linear-gradient(180deg,var(--gold),#a2730a)}

    /* status pills — the feature table's verdict column */
    .sp{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;
      letter-spacing:.05em;border:1px solid var(--edge);border-radius:99px;padding:3px 9px;white-space:nowrap;color:var(--muted)}
    .sp i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:0 0 auto}
    .sp.dead{color:#fca5a5;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.12)}
    .sp.cold{color:var(--gold);border-color:rgba(245,179,1,.35);background:rgba(245,179,1,.09)}
    .sp.live{color:#86efac;border-color:rgba(74,222,128,.32);background:rgba(74,222,128,.09)}
    .sp.fresh{color:#9ec5fe;border-color:rgba(96,165,250,.32);background:rgba(96,165,250,.09)}
    tbody tr.deadrow{background:rgba(248,113,113,.07)}
    tbody tr.deadrow:hover{background:rgba(248,113,113,.12)}
    td.lcell{text-align:left}
    .tsub{display:block;font-size:11px;color:var(--muted2);font-weight:500;margin-top:2px}

    /* sparkline strip — the new per-day series */
    .sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .spark{background:var(--card);border:1px solid var(--edge2);border-radius:14px;padding:12px 13px 10px;box-shadow:var(--shadow)}
    .spark .sl{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
    .spark .sv{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
    .spark .sd{font-size:11.5px;margin-top:3px;color:var(--muted)}
    .spark svg{display:block;width:100%;height:30px;margin-top:8px}

    /* two-way proportion bar */
    .split{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--edge2)}
    .splitleg{display:flex;gap:16px;margin-top:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
    .splitleg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
    .ptitle{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:10px}
    .stack{margin-top:12px}

    /* THE BRIEFING — the page opens with what is broken, not with counters.
       Each row jumps to the section that proves it. */
    .brief{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--edge);
      border-radius:16px;padding:16px 16px 6px;box-shadow:var(--shadow)}
    .brow{display:flex;gap:11px;align-items:flex-start;padding:11px 0;min-height:44px;
      border-bottom:1px solid var(--edge2);color:var(--ink2);font-size:13.5px;line-height:1.5;text-decoration:none}
    .brow:last-of-type{border-bottom:0}
    .brow:hover{color:var(--ink)}
    .bdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--muted2)}
    .brow.bad .bdot{background:var(--red)}
    .brow.warn .bdot{background:var(--gold)}
    .bname{color:var(--ink);font-weight:800}
    .bgo{margin-left:auto;color:var(--muted2);font-size:16px;line-height:1.2;flex:0 0 auto;padding-left:8px}
    .bfoot{font-size:12px;color:var(--muted);line-height:1.5;padding:11px 0 10px;border-top:1px solid var(--edge2)}

    .sec{scroll-margin-top:84px}

    /* ——— THE ANSWER SCREEN (2026-11-20) ————————————————————————————————
       Charbel opens this every few days to learn two things: is it working, and
       what is broken. Both now fit above the fold; everything that used to be
       stacked below is evidence, reachable but folded away. The old `.hero`
       radial-gradient slab is gone — the key metric is the first read in the row
       rather than a decorative panel of its own. */
    .answer{background:var(--card);border:1px solid var(--edge);border-radius:18px;
      padding:18px 20px 4px;margin-bottom:14px;box-shadow:var(--shadow)}
    .answer .al{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);font-weight:800}

    /* The reads: one row of plain numbers, hairline-divided. Not six cards — the
       summary must not look like another grid of the detail below it. */
    .reads{display:flex;flex-wrap:wrap;gap:0;margin-top:14px}
    .reads > div{padding:2px 20px 14px;min-width:148px;flex:1 1 148px}
    .reads > div + div{border-left:1px solid var(--edge2)}
    .reads > div:first-child{padding-left:0}
    .reads .rl{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3;
      min-height:2.6em}  /* two lines reserved so the six values share a baseline */
    .reads .rv{font-size:25px;font-weight:800;line-height:1.15;margin-top:5px;letter-spacing:-.015em;
      font-variant-numeric:tabular-nums;color:var(--ink)}
    .reads .rv.thin{font-size:19px;font-weight:700;color:var(--muted)}
    /* --muted2 measures 3.58:1 on --card — under the 4.5:1 floor for text this size.
       --muted is 6.22:1. This is the most-read text on the page; it gets the readable one. */
    .reads .rn{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
    .reads .rd{font-size:12.5px;font-weight:700;margin-top:3px}
    /* The lead read (the key metric) carries the weight the old hero carried. */
    .reads > div.lead .rv{font-size:clamp(34px,6vw,44px);font-weight:900;letter-spacing:-.025em}
    .reads > div.lead{flex:1 1 230px}
    @media(max-width:620px){
      .reads > div{flex:1 1 44%;min-width:0}
      .reads > div:nth-child(odd){border-left:0;padding-left:0}
    }

    /* ——— DISCLOSURE GROUPS ————————————————————————————————————————
       Everything below the answer is folded. `<details>` because it is the
       standard affordance: keyboard-operable, findable by the browser, no
       invented widget. Open state persists per group in localStorage. */
    .grp{border-top:1px solid var(--edge2);margin-top:2px}
    .grp:last-of-type{border-bottom:1px solid var(--edge2)}
    .grp > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
      min-height:52px;padding:4px 2px;user-select:none;-webkit-tap-highlight-color:transparent}
    .grp > summary::-webkit-details-marker{display:none}
    .grp > summary:hover .gt{color:var(--ink)}
    .grp > summary:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:8px}
    .grp .gchev{flex:0 0 auto;width:16px;height:16px;color:var(--muted);transition:transform .18s cubic-bezier(.22,1,.36,1)}
    .grp[open] > summary .gchev{transform:rotate(90deg)}
    .grp .gt{font-size:13.5px;font-weight:800;color:var(--ink2);letter-spacing:-.01em;transition:color .15s}
    .grp .gn{font-size:12.5px;color:var(--muted);font-weight:500}
    .grp .gcount{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700;
      border:1px solid var(--edge2);border-radius:99px;padding:3px 9px;white-space:nowrap;flex:0 0 auto}
    .grp .gbody{padding:2px 0 26px}
    /* The first section title inside an opened group shouldn't double the gap. */
    .grp .gbody > .sec:first-child{margin-top:12px}
    @media(max-width:620px){ .grp .gn{display:none} }
  </style>
</head>
<body>
  <div id="app"><div class="msg">Loading…</div></div>

  <script>
  // ===================================================================
  // Pure data logic — no DOM. (Unit-tested in Node before shipping.)
  // ===TESTABLE_START===
  function n(v){return (typeof v==='number'&&isFinite(v))?v:(Number(v)||0);}
  function ymd(s){return String(s).slice(0,10);}
  function fmt(v){v=n(v);return (Math.abs(v-Math.round(v))<1e-9)? String(Math.round(v)) : v.toFixed(1);}

  // ——— THE HONEST-RATE RULE ————————————————————————————————————————
  // This is a 71-person app. A percentage on a base of 3 is a lie told
  // confidently, so: a rate NEVER travels without its absolute, and under
  // MIN_BASE we print the raw fraction instead of a bold percentage.
  // Every rate on this page goes through here.
  var MIN_BASE=10;
  function rate(num, den){
    num=n(num); den=n(den);
    if(den<=0)       return {ok:false,text:'—',                  base:'nothing to measure yet',                           pct:null};
    if(den<MIN_BASE) return {ok:false,text:fmt(num)+' of '+fmt(den), base:'base of '+fmt(den)+' — too small for a percentage', pct:100*num/den};
    return             {ok:true, text:Math.round(100*num/den)+'%', base:fmt(num)+' of '+fmt(den),                          pct:100*num/den};
  }

  // Metric registry. `avg:true` = per-day distinct (active users) → averaged in a
  // bin, never summed. Everything else is a volume that sums.
  // `opt:true` = a daily[] field the SQL may not have shipped yet; offered as a
  // chip only once it actually appears in the series.
  var METRICS = [
    {key:'checkins',    label:'Check-ins',   color:'#FF5A1F'},
    {key:'verified',    label:'Verified',    color:'#F5B301'},
    {key:'wvcc',        label:'Key metric',  color:'#FF8A3D'},
    {key:'active_users',label:'Active/day',  color:'#4ade80', avg:true},
    {key:'openers',     label:'Openers/day', color:'#2dd4bf', avg:true},
    {key:'new_users',   label:'New users',   color:'#60a5fa'},
    {key:'reactions',   label:'Reactions',   color:'#c084fc'},
    {key:'nudges',      label:'Nudges',      color:'#f472b6'},
    {key:'with_media',  label:'With media',  color:'#22d3ee'},
    {key:'comments',    label:'Comments',    color:'#818cf8', opt:true},
    {key:'meals',       label:'Meals',       color:'#a3e635', opt:true},
    {key:'music',       label:'Music',       color:'#34d399', opt:true},
    {key:'tags',        label:'Tags',        color:'#e879f9', opt:true},
    {key:'invites',     label:'Invites',     color:'#38bdf8', opt:true},
    {key:'clicks',      label:'Link clicks', color:'#fcd34d', opt:true}
  ];
  var NEW_DAILY=['comments','meals','music','tags','invites','clicks'];
  var SUM_KEYS=['checkins','verified','with_media','photo','video','wvcc','new_users','reactions','nudges','opens','new_friendships',
                'comments','meals','music','tags','invites','clicks'];
  function isAvg(k){for(var i=0;i<METRICS.length;i++)if(METRICS[i].key===k)return !!METRICS[i].avg;return false;}

  // A daily[] field only EXISTS once the SQL ships it. Summing an absent key
  // would print a confident wall of zeros, so we check before offering it.
  function dailyHasKey(daily, k){
    daily=daily||[];
    for(var i=0;i<daily.length;i++){var v=daily[i][k];if(v!==undefined&&v!==null)return true;}
    return false;
  }
  function availableMetrics(daily){
    return METRICS.filter(function(m){return !m.opt || dailyHasKey(daily,m.key);});
  }
  // The step with the biggest proportional drop from the step before it.
  // -1 when nothing drops (or there is nothing to drop from).
  function leakIndex(steps){
    var worst=0, at=-1;
    for(var i=1;i<steps.length;i++){
      var p=n(steps[i-1].v); if(p<=0) continue;
      var d=(p-n(steps[i].v))/p;
      if(d>worst+1e-9){worst=d;at=i;}
    }
    return at;
  }

  // Current window from the full daily[] for a filter state.
  function selectWindow(daily, state){
    if(state.mode==='custom' && state.start && state.end){
      var s=ymd(state.start), e=ymd(state.end);
      if(e<s){var t=s;s=e;e=t;}
      return daily.filter(function(r){var d=ymd(r.date);return d>=s && d<=e;});
    }
    var days=state.range;
    return daily.slice(Math.max(0, daily.length-days));
  }
  // The equal-length window immediately BEFORE `cur`.
  function prevWindow(daily, cur){
    if(!cur.length) return [];
    var first=ymd(cur[0].date);
    var idx=-1;
    for(var i=0;i<daily.length;i++){if(ymd(daily[i].date)===first){idx=i;break;}}
    if(idx<=0) return [];
    return daily.slice(Math.max(0, idx-cur.length), idx);
  }
  function sum(rows, key){var t=0;for(var i=0;i<rows.length;i++)t+=n(rows[i][key]);return t;}
  function mean(rows, key){return rows.length? sum(rows,key)/rows.length : 0;}

  // Bin rows to daily (identity) or ISO-week (Mon). Sums volumes; averages avg-keys.
  function binRows(rows, gran){
    if(gran!=='week') return rows.map(function(r){var o={label:r.date,date:r.date,_days:1};SUM_KEYS.forEach(function(k){o[k]=n(r[k]);});o.active_users=n(r.active_users);o.openers=n(r.openers);return o;});
    var buckets={}, order=[];
    rows.forEach(function(r){
      var d=new Date(ymd(r.date)+'T00:00:00Z');
      var dow=(d.getUTCDay()+6)%7;                 // 0=Mon
      var mon=new Date(d.getTime()-dow*86400000);
      var key=mon.toISOString().slice(0,10);
      if(!buckets[key]){buckets[key]={label:key,date:key,_days:0,_actSum:0,_opnSum:0};order.push(key);SUM_KEYS.forEach(function(k){buckets[key][k]=0;});}
      var b=buckets[key];
      b._days++; b._actSum+=n(r.active_users); b._opnSum+=n(r.openers);
      SUM_KEYS.forEach(function(k){b[k]+=n(r[k]);});
    });
    return order.map(function(k){var b=buckets[k];b.active_users=b._days?b._actSum/b._days:0;b.openers=b._days?b._opnSum/b._days:0;return b;});
  }
  // Value of a metric for one binned row (avg keys already averaged in the bin).
  function metricVal(row, key){return isAvg(key)? n(row[key]) : n(row[key]);}
  // Window aggregate for a metric: sum for volumes, mean for avg-keys.
  function windowVal(rows, key){return isAvg(key)? mean(rows,key) : sum(rows,key);}

  function verifiedPct(rows){var c=sum(rows,'checkins');return c? 100*sum(rows,'verified')/c : 0;}
  function mediaPct(rows){var c=sum(rows,'checkins');return c? 100*sum(rows,'with_media')/c : 0;}
  // ===TESTABLE_END===

  // ===================================================================
  // Formatting + small helpers (browser only below here)
  // ===================================================================
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(s){var p=ymd(s).split('-');return MON[(+p[1]||1)-1]+' '+(+p[2]);}
  function fmtPct(v){return fmt(v)+'%';}
  // Hours → a unit a human reads. null when there is nothing to report.
  function fmtDur(hrs){
    hrs=n(hrs);
    if(hrs<=0) return null;
    if(hrs<1)  return Math.round(hrs*60)+' min';
    if(hrs<48) return (hrs<10? fmt(Math.round(hrs*10)/10) : String(Math.round(hrs)))+' h';
    return Math.round(hrs/24)+' days';
  }
  function daysSince(d){
    if(!d) return null;
    var t=Date.parse(ymd(d)+'T00:00:00Z');
    if(!isFinite(t)) return null;
    return Math.max(0, Math.round((Date.now()-t)/86400000));
  }
  function plural(v,one,many){return fmt(v)+' '+(n(v)===1? one : many);}
  function fmtBytes(b){b=n(b);if(b<1024)return Math.round(b)+' B';var u=['KB','MB','GB','TB'],i=-1;do{b/=1024;i++;}while(b>=1024&&i<u.length-1);return (b<10?b.toFixed(1):Math.round(b))+' '+u[i];}
  function metricByKey(k){for(var i=0;i<METRICS.length;i++)if(METRICS[i].key===k)return METRICS[i];return METRICS[0];}

  function deltaHtml(cur,prev,opts){
    opts=opts||{};
    var d=cur-prev, pct=prev!==0? Math.round(d/Math.abs(prev)*100):null;
    if(Math.abs(d)<1e-9 && prev===0 && cur===0) return '<span class="flat">— no data last period</span>';
    var cls=d>0?'up':d<0?'down':'flat', arw=d>0?'▲':d<0?'▼':'—';
    var body;
    if(opts.pp){ body=(d>=0?'+':'')+fmt(d)+' pp'; }
    else { body=(d>=0?'+':'')+fmt(d)+(pct!=null?' ('+(pct>=0?'+':'')+pct+'%)':''); }
    return '<span class="delta '+cls+'">'+arw+' '+body+'</span> <span class="flat" style="font-weight:600">vs prev</span>';
  }

  // ===================================================================
  // State (persisted so a reload / auto-refresh keeps your view)
  // ===================================================================
  var LSK='repcall_dash_state_v1';
  var state=loadState();
  function loadState(){
    var def={mode:'preset',range:30,start:null,end:null,gran:'day',compare:false,metric:'checkins',realOnly:false,usersHideTest:true};
    try{var s=JSON.parse(localStorage.getItem(LSK));if(s&&typeof s==='object')return Object.assign(def,s);}catch(e){}
    return def;
  }
  function saveState(){try{localStorage.setItem(LSK,JSON.stringify(state));}catch(e){}}

  var RAW=null, KEY=null, timer=null;

  // ===================================================================
  // Rendering
  // ===================================================================
  function h(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

  function render(){
    var app=document.getElementById('app');
    app.innerHTML='';
    var wrap=h('<div class="wrap"></div>');

    wrap.appendChild(header());

    // A chip for a daily[] field the SQL hasn't shipped would chart a flat zero.
    if(!availableMetrics(RAW.daily).some(function(m){return m.key===state.metric;})) state.metric='checkins';

    // ——— THE ANSWER. Six reads, then what needs attention. ————————————
    // The range controls used to sit here, above everything. They only affect the
    // series tier, so they now live inside it; keeping them at the top implied the
    // whole page moved with them, which was never true — arrival, the invite loop,
    // features, streaks, proof and compliance are all fixed 7/30-day windows from
    // the snapshot. The one control that does change every number on the page —
    // "Real only", which refetches without seed rows — stays in the header.
    wrap.appendChild(safe(answer, 'Where it stands'));
    wrap.appendChild(safe(briefing, 'What needs attention'));

    // ——— THE EVIDENCE, folded. ————————————————————————————————————————
    var flagged=flaggedCount();
    wrap.appendChild(group('g-questions', 'Why', 'the eight questions in full',
      flagged? (flagged+' flagged') : 'all clear', function(body){
      body.appendChild(sectionTitle('Arrival shape', 'question 1 · does a new person arrive alone?', badgeFor('arrival'), 'q-arrival'));
      body.appendChild(safe(arrivalSection, 'Arrival shape'));

      body.appendChild(sectionTitle('Invite loop', 'question 2 · where does it leak?', badgeFor('invite_loop'), 'q-invite'));
      body.appendChild(safe(inviteLoopSection, 'Invite loop'));

      body.appendChild(sectionTitle('What we shipped', 'question 3 · adoption per feature, worst first', badgeFor('features'), 'q-shipped'));
      body.appendChild(safe(featuresSection, 'What we shipped'));

      body.appendChild(sectionTitle('Social depth', 'question 4 · broad, or carried by one person?', badgeFor('social_depth'), 'q-social'));
      body.appendChild(safe(socialDepthSection, 'Social depth'));

      body.appendChild(sectionTitle('Streak health', 'question 5 · are the flames alive?', badgeFor('streaks'), 'q-streaks'));
      body.appendChild(safe(streaksSection, 'Streak health'));

      body.appendChild(sectionTitle('Proof', 'question 6 · is a check-in trusted, and if not, why?', badgeFor('verification'), 'q-proof'));
      body.appendChild(safe(verificationSection, 'Proof'));

      body.appendChild(sectionTitle('Notifications', 'question 7 · what we send, and who can receive it', badgeFor('notifications'), 'q-notify'));
      body.appendChild(safe(notificationsSection, 'Notifications'));

      body.appendChild(sectionTitle('Compliance gate', 'question 8 · terms + date of birth, for the Play UGC requirement', badgeFor('compliance'), 'q-comply'));
      body.appendChild(safe(complianceSection, 'Compliance gate'));
    }));

    wrap.appendChild(group('g-series', 'Volume over time', 'check-ins, openers and the rest, by day or week',
      null, function(body){
      body.appendChild(seriesControls());
      var cur=selectWindow(RAW.daily, state), prev=prevWindow(RAW.daily, cur);

      body.appendChild(sectionTitle('This period', rangeLabel(cur)+' · compared with the '+(prev.length||0)+' days before'));
      body.appendChild(kpis(cur, prev));

      body.appendChild(sectionTitle('Trend', 'pick a metric · '+(state.compare?'previous period overlaid':'toggle Compare to overlay the previous period')));
      body.appendChild(trendPanel(cur, prev));

      body.appendChild(sectionTitle('Newer signals', 'what the recent releases produce · totals for '+rangeLabel(cur)));
      body.appendChild(safe(function(){return sparksStrip(cur, prev);}, 'Newer signals'));

      body.appendChild(sectionTitle('Day-by-day', (state.gran==='week'?'by week':'by day')+' · newest first · arrow = change vs the '+(state.gran==='week'?'previous week':'previous day')));
      body.appendChild(dayTable(cur));
    }));

    wrap.appendChild(group('g-reference', 'Reference & operations', 'background numbers · nothing here needs a decision today',
      null, function(body){
      var cur=selectWindow(RAW.daily, state);

      body.appendChild(sectionTitle('Habit', 'unique openers — daily / weekly / monthly · DAU÷WAU'));
      body.appendChild(stickiness());

      body.appendChild(sectionTitle('Retention & all-time', 'weekly return rate · lifetime totals'));
      body.appendChild(retentionAllTime());
      body.appendChild(retentionCurve());

      body.appendChild(sectionTitle('When people work out', 'check-ins by time of day & weekday · last 90 days ('+RAW.tz+')'));
      body.appendChild(patternPanels());

      body.appendChild(sectionTitle('Platform', 'unique users by device · all-time · 7-day-active in the sub'));
      body.appendChild(platformSplit());
      body.appendChild(platformTrend(cur));

      body.appendChild(sectionTitle('Users', 'everyone on the app · newest first'));
      body.appendChild(usersPanel());

      body.appendChild(sectionTitle('Capacity & limits', 'backend usage vs the Free-plan ceilings'));
      body.appendChild(capacityPanel());
    }));

    wrap.appendChild(h('<div class="foot">First-party analytics · aggregate only, no personal data leaves the database · week &amp; day boundaries use '+esc(RAW.tz)+
      '.<br/>Key metric = each week, verified workouts by users who have at least one friend. Auto-refreshes every 5 minutes.'+
      '<br/>Rates on a base under '+MIN_BASE+' are printed as a raw fraction, never as a percentage. Panels marked &ldquo;not yet reported&rdquo; are waiting on the '+
      'analytics snapshot update and fill in by themselves.</div>'));

    app.appendChild(wrap);

    // Now the tree is live: run the work that needed real geometry.
    if(PENDING_AFTER){ PENDING_AFTER=false; requestAnimationFrame(afterOpen); }

    // A deep link (or a briefing row followed on a fresh load) has to unfold its group.
    if(location.hash) revealTarget(location.hash);
  }

  // How many of the eight read bad or warn — the count on the folded group, so the
  // fold never hides the fact that something is wrong.
  function flaggedCount(){
    var k=0;
    QUESTIONS.forEach(function(q){
      if(!present(q.key)) return;
      var v=null; try{ v=q.v(); }catch(e){ v=null; }
      if(v && (v.tone==='bad'||v.tone==='warn')) k++;
    });
    return k;
  }

  function header(){
    var gen=RAW.generated_at? new Date(RAW.generated_at) : null;
    var when=gen? (gen.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})) : '—';
    var el=h('<div class="top anim">'+
      '<div class="brand">Rep<span>Call</span> Analytics</div>'+
      '<div class="meta">'+
        '<span class="gen"><span class="dot" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>updated <b>'+esc(when)+'</b></span>'+
        // "Real only" refetches the whole snapshot without the demo seed, so it belongs
        // beside the title rather than in the series controls: it moves every number
        // on the page, including the six in the answer block.
        '<button class="toggle" id="realToggle" aria-pressed="'+state.realOnly+'"><span class="sw"></span><span class="tt">Real only</span></button>'+
        '<button class="refresh" id="refreshBtn">↻ Refresh</button>'+
      '</div></div>');
    el.querySelector('#refreshBtn').addEventListener('click',function(){refetch(true);});
    el.querySelector('#realToggle').addEventListener('click',function(){state.realOnly=!state.realOnly;saveState();refetch(true);});
    return el;
  }

  // The range / granularity / compare controls. They only reshape the series tier,
  // which is why they live inside it. "Real only" is NOT here — see header().
  function seriesControls(){
    var el=h('<div class="controls">'+
      '<div class="cgroup"><span class="clabel">Range</span>'+
        '<div class="seg" id="rangeSeg">'+
          [['7','7d'],['14','14d'],['30','30d'],['90','90d'],['custom','Custom']].map(function(o){
            var on=(o[0]==='custom')? state.mode==='custom' : (state.mode==='preset'&&String(state.range)===o[0]);
            return '<button data-r="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>';
          }).join('')+
        '</div>'+
        '<div class="custom'+(state.mode==='custom'?' show':'')+'" id="customBox">'+
          '<input type="date" id="startD" value="'+(state.start||'')+'"/>'+
          '<span>→</span>'+
          '<input type="date" id="endD" value="'+(state.end||'')+'"/>'+
        '</div>'+
      '</div>'+
      '<div class="cgroup"><span class="clabel">View</span>'+
        '<div class="seg subtle" id="granSeg">'+
          ['day','week'].map(function(g){return '<button data-g="'+g+'" aria-pressed="'+(state.gran===g)+'">'+(g==='day'?'Day':'Week')+'</button>';}).join('')+
        '</div>'+
      '</div>'+
      '<div class="cgroup">'+
        '<button class="toggle" id="cmpToggle" aria-pressed="'+state.compare+'"><span class="sw"></span><span class="tt">Compare</span></button>'+
      '</div>'+
    '</div>');

    el.querySelector('#rangeSeg').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b)return;
      var r=b.getAttribute('data-r');
      if(r==='custom'){
        state.mode='custom';
        if(!state.start||!state.end){ // seed sensible defaults from available data
          var dl=RAW.daily; state.end=ymd(dl[dl.length-1].date); state.start=ymd(dl[Math.max(0,dl.length-30)].date);
        }
      } else { state.mode='preset'; state.range=+r; }
      saveState(); render();
    });
    var cb=el.querySelector('#customBox');
    if(cb){
      cb.querySelector('#startD').addEventListener('change',function(e){state.start=e.target.value;state.mode='custom';saveState();render();});
      cb.querySelector('#endD').addEventListener('change',function(e){state.end=e.target.value;state.mode='custom';saveState();render();});
    }
    el.querySelector('#granSeg').addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b)return; state.gran=b.getAttribute('data-g'); saveState(); render();
    });
    el.querySelector('#cmpToggle').addEventListener('click',function(){state.compare=!state.compare;saveState();render();});
    return el;
  }

  function rangeLabel(cur){
    if(!cur.length) return 'no data';
    return fmtDate(cur[0].date)+' – '+fmtDate(cur[cur.length-1].date);
  }

  // ——— THE ANSWER SCREEN ————————————————————————————————————————————
  // Six reads and the attention list. This is the whole page for most visits;
  // everything below it is the evidence for one of these six.
  //
  // Every rate still goes through rate(), so a base under MIN_BASE prints "2 of 5"
  // and not "40%". That matters more here than anywhere else on the page: this is
  // the block someone screenshots.
  function readHtml(label, valueHtml, note, cls){
    return '<div'+(cls? ' class="'+cls+'"':'')+'>'+
      '<div class="rl">'+esc(label)+'</div>'+
      '<div class="rv">'+valueHtml+'</div>'+
      (note? '<div class="rn">'+note+'</div>' : '')+
    '</div>';
  }
  var MISSING='<span class="rv thin">not yet reported</span>';

  // rate() switches to a percentage once the base clears MIN_BASE, which is right
  // everywhere except on a zero numerator: "0%" is true and tells you nothing, while
  // "0 of 20" is the finding. In the answer block the base always shows for a zero.
  function answerRate(num, den){
    num=n(num); den=n(den);
    if(den>0 && num===0) return {ok:true, text:fmt(0)+' of '+fmt(den)};
    var r=rate(num,den);
    return {ok:r.ok, text:r.text};
  }

  function answer(){
    var ns=RAW.north_star||{}, ar=RAW.arrival||{}, il=RAW.invite_loop||{}, st=RAW.streaks||{};
    var reads='';

    // 1 — the key metric, carrying the weight the old hero panel carried.
    reads+='<div class="lead">'+
      '<div class="rl">'+esc(ns.label||'Verified workouts by people who have a friend')+' · this week</div>'+
      '<div class="rv">'+fmt(n(ns.this_week))+'</div>'+
      '<div class="rd">'+deltaHtml(n(ns.this_week),n(ns.prev_week))+'</div>'+
    '</div>';

    // 2 — did anyone new turn up, and 3 — did anyone reach them.
    if(present('arrival')){
      var alone=n(ar.alone_30d), withF=n(ar.with_friend_30d), arrived=alone+withF;
      reads+=readHtml('New people · 30 days', fmt(arrived),
        arrived? (fmt(alone)+' of them arrived alone') : 'nobody signed up in the last 30 days');
      var lf=answerRate(withF, arrived);
      reads+=readHtml('Landed with a friend',
        lf.ok? esc(lf.text) : '<span class="'+(arrived?'':'thin')+'">'+esc(lf.text)+'</span>',
        arrived? 'someone was already there when they opened it' : null);
    } else {
      reads+=readHtml('New people · 30 days', MISSING, null);
    }

    // 4 — the growth loop, in one fraction.
    if(present('invite_loop')){
      var sent=n(il.sent_30d), conn=n(il.connected_30d), cl=answerRate(conn, sent);
      reads+=readHtml('Invites that connected',
        cl.ok? esc(cl.text) : '<span class="'+(sent?'':'thin')+'">'+esc(cl.text)+'</span>',
        sent? 'in the last 30 days' : 'no invites went out in 30 days');
    } else {
      reads+=readHtml('Invites that connected', MISSING, null);
    }

    // 5 — the habit, and 6 — the number this product lives or dies on.
    if(present('streaks')){
      reads+=readHtml('Flames alive', fmt(n(st.alive)),
        n(st.at_risk)? (fmt(n(st.at_risk))+' at risk this week') : 'none at risk');
    }
    if(present('arrival') && Array.isArray(ar.by_squad)){
      var solo=ar.by_squad.filter(function(b){return String(b.squad)==='0';})[0];
      if(solo){
        var note='no friend on the app';
        if(solo.checkins_per_user_30d!=null) note+=' · '+fmt(solo.checkins_per_user_30d)+' check-ins each / 30d';
        reads+=readHtml('Alone on the app', fmt(n(solo.users)), note);
      }
    }

    var el=h('<div class="answer anim">'+
      '<div class="al">Where it stands</div>'+
      '<div class="reads">'+reads+'</div>'+
    '</div>');
    return el;
  }

  // ——— DISCLOSURE ————————————————————————————————————————————————
  // One <details> per tier. Closed by default: the answer above is the visit.
  // Open state persists, so someone who lives in one tier keeps it open.
  function openSet(){
    try{ var v=JSON.parse(localStorage.getItem(LSK+':open')); return (v && typeof v==='object')? v : {}; }
    catch(e){ return {}; }
  }
  function setOpen(id, on){
    try{ var o=openSet(); if(on) o[id]=1; else delete o[id]; localStorage.setItem(LSK+':open', JSON.stringify(o)); }
    catch(e){}
  }
  var CHEV='<svg class="gchev" viewBox="0 0 16 16" fill="none" aria-hidden="true">'+
    '<path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // build() runs ONLY when the group is first opened — the chart, the user roster
  // and the quota panel are not worth rendering for a visit that never looks at them.
  function group(id, title, note, count, build){
    var isOpen=!!openSet()[id];
    var el=h('<details class="grp" id="'+esc(id)+'"'+(isOpen?' open':'')+'>'+
      '<summary>'+CHEV+'<span class="gt">'+esc(title)+'</span>'+
        (note? '<span class="gn">'+esc(note)+'</span>':'')+
        (count? '<span class="gcount">'+esc(count)+'</span>':'')+
      '</summary>'+
      '<div class="gbody"></div>'+
    '</details>');
    var body=el.querySelector('.gbody'), built=false;
    function fill(){
      if(built) return; built=true;
      try{ build(body); }
      catch(e){ body.appendChild(h('<div class="pending"><div class="pl">Could not render</div>'+
        '<div class="pb">'+esc(title)+': '+esc(String((e&&e.message)||e))+'</div></div>')); }
      // A group that starts open is filled DURING render(), while this element is
      // still detached — the wrapper isn't in the document until the end. Anything
      // that measures itself (the chart reads a width) must wait for that, so it is
      // queued and flushed after the append. Measured: scheduling it here directly
      // produced a blank chart in 1 run out of 3, silently, because drawTrend returns
      // early when it cannot find its container.
      if(el.isConnected) requestAnimationFrame(afterOpen);
      else PENDING_AFTER=true;
    }
    el.addEventListener('toggle',function(){
      setOpen(id, el.open);
      if(el.open) fill();
    });
    if(isOpen) fill();
    return el;
  }

  // Set when a group was filled before the page was in the document; render() flushes
  // it once the wrapper is appended.
  var PENDING_AFTER=false;

  // Anything that measures itself has to run after its group is actually visible —
  // a chart drawn inside a closed <details> gets a width of zero, and one drawn into
  // a detached tree never finds its container at all.
  function afterOpen(){
    var cur=selectWindow(RAW.daily, state), prev=prevWindow(RAW.daily, cur);
    // Failures here are reported, not swallowed. A silent catch around the chart is
    // how a blank panel ships: the page looks fine and the one thing that measured
    // itself quietly did nothing.
    [['chart',function(){
        drawTrend(cur, prev);
        var g=document.getElementById('g-series'), cw=document.getElementById('chartwrap');
        if(g && g.open && (!cw || !cw.querySelector('svg')))
          throw new Error('the trend panel is open but no chart was drawn');
      }],
     ['users',ensureUsers],
     ['capacity',ensureCapacity]].forEach(function(j){
      try{ j[1](); }
      catch(e){ if(window.console&&console.error) console.error('afterOpen/'+j[0]+': '+((e&&e.message)||e)); }
    });
  }

  // A briefing row points at a section inside a folded group. Open the group first,
  // then let the anchor scroll — otherwise the click lands on a display:none target
  // and the page just sits there.
  function revealTarget(hash){
    if(!hash || hash.charAt(0)!=='#') return;
    var target=document.getElementById(hash.slice(1));
    if(!target) return;
    var grp=target.closest('details.grp');
    if(grp && !grp.open){ grp.open=true; setOpen(grp.id, true); }
    requestAnimationFrame(function(){
      // Guarded: scrollIntoView is missing in some embedded/headless viewers, and an
      // unfolded-but-unscrolled group is still a working outcome.
      try{ target.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){}
    });
  }

  function drawTrend(cur, prev){
    var wrap=document.getElementById('chartwrap'); if(!wrap)return;
    var mk=metricByKey(state.metric);
    var curB=binRows(cur, state.gran);
    var prevB=state.compare? binRows(prev, state.gran) : [];
    var W=840,H=300,PL=46,PR=14,PT=16,PB=34;
    var plotW=W-PL-PR, plotH=H-PT-PB;
    var curVals=curB.map(function(r){return metricVal(r,state.metric);});
    var prevVals=prevB.map(function(r){return metricVal(r,state.metric);});
    var maxV=Math.max(1, Math.max.apply(null,curVals.concat(prevVals.length?prevVals:[0])));
    // nice ceiling
    var step=Math.pow(10,Math.floor(Math.log10(maxV)));
    var ceil=Math.ceil(maxV/step)*step; if(ceil<maxV)ceil+=step; if(ceil===0)ceil=1;
    var cnt=curB.length;
    function X(i){return cnt<=1? PL+plotW/2 : PL + i*(plotW/(cnt-1));}
    function Y(v){return PT + plotH*(1 - v/ceil);}

    // gridlines + y labels (4)
    var grid='';
    for(var t=0;t<=4;t++){var gy=PT+plotH*t/4;var gv=ceil*(1-t/4);
      grid+='<line class="grid-l" x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'"/>';
      grid+='<text class="axis-t" x="'+(PL-8)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end">'+fmt(gv)+'</text>';
    }
    // x labels (~7 evenly spaced)
    var xlab=''; var everyX=Math.max(1,Math.ceil(cnt/7));
    for(var i=0;i<cnt;i++){ if(i%everyX!==0 && i!==cnt-1) continue;
      xlab+='<text class="axis-t" x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(fmtDate(curB[i].date))+'</text>';
    }
    function path(vals){var d='';for(var i=0;i<vals.length;i++){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1)+' ';}return d.trim();}
    var area=''; if(curVals.length){var ap=path(curVals)+' L'+X(cnt-1).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
      area='<path class="area" d="'+ap+'" fill="url(#g_'+mk.key+')"/>';}
    var prevLine=prevVals.length? '<path class="linec" d="'+path(prevVals)+'"/>' : '';
    var curLine='<path class="linep" d="'+path(curVals)+'" stroke="'+mk.color+'"/>';
    var dots=''; if(cnt<=31){for(var i=0;i<cnt;i++)dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(curVals[i]).toFixed(1)+'" r="2.6" fill="'+mk.color+'"/>';}

    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(mk.label)+' trend">'+
      '<defs><linearGradient id="g_'+mk.key+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+mk.color+'" stop-opacity="0.9"/><stop offset="100%" stop-color="'+mk.color+'" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      grid+xlab+area+prevLine+curLine+dots+
      '<line class="guide" id="guide" y1="'+PT+'" y2="'+(H-PB)+'"/>'+
      '<circle class="cursor" id="cursor" r="4.5" fill="'+mk.color+'" stroke="#0c0908" stroke-width="2"/>'+
    '</svg>';

    // keep the tip node, replace the svg
    var tip=document.getElementById('tip');
    wrap.querySelectorAll('svg').forEach(function(s){s.remove();});
    wrap.insertAdjacentHTML('afterbegin', svg);
    var svgEl=wrap.querySelector('svg'), guide=wrap.querySelector('#guide'), cursor=wrap.querySelector('#cursor');

    // legend
    var lg=document.getElementById('legend');
    lg.innerHTML='<span><i style="border-top-color:'+mk.color+'"></i>'+esc(mk.label)+' — this period</span>'+
      (state.compare?'<span><i class="prev"></i>previous period</span>':'');

    function showAt(i){
      if(i<0||i>=cnt)return;
      guide.setAttribute('x1',X(i)); guide.setAttribute('x2',X(i)); guide.style.opacity='1';
      cursor.setAttribute('cx',X(i)); cursor.setAttribute('cy',Y(curVals[i])); cursor.style.opacity='1';
      var rows='<div class="row"><span class="k" style="background:'+mk.color+'"></span>'+esc(mk.label)+': <b>'+fmt(curVals[i])+'</b></div>';
      if(state.compare && prevVals.length){
        var pv=(i<prevVals.length)? prevVals[i] : null;
        if(pv!=null){var dd=curVals[i]-pv;var cls=dd>0?'up':dd<0?'down':'flat';
          rows+='<div class="row"><span class="k" style="background:var(--muted)"></span>prev: <b>'+fmt(pv)+'</b> <span class="'+cls+'" style="font-size:11px">('+(dd>=0?'+':'')+fmt(dd)+')</span></div>';}
      }
      var lbl=fmtDate(curB[i].date)+(state.gran==='week'?' (week)':'');
      if(state.compare && prevB[i]) lbl+=' · vs '+fmtDate(prevB[i].date);
      tip.innerHTML='<div class="td">'+esc(lbl)+'</div>'+rows;
      tip.style.left=(X(i)/W*100)+'%';
      tip.style.top=(Y(Math.max(curVals[i], (state.compare&&prevVals[i]!=null)?prevVals[i]:0))/H*100)+'%';
      tip.style.opacity='1';
    }
    function hide(){guide.style.opacity='0';cursor.style.opacity='0';tip.style.opacity='0';}
    function idxFromEvent(e){
      var rect=svgEl.getBoundingClientRect();
      var cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
      var frac=Math.max(0,Math.min(1,cx/rect.width));
      var xView=frac*W;
      if(cnt<=1)return 0;
      return Math.max(0,Math.min(cnt-1,Math.round((xView-PL)/(plotW/(cnt-1)))));
    }
    svgEl.addEventListener('mousemove',function(e){showAt(idxFromEvent(e));});
    svgEl.addEventListener('mouseleave',hide);
    svgEl.addEventListener('touchstart',function(e){showAt(idxFromEvent(e));},{passive:true});
    svgEl.addEventListener('touchmove',function(e){showAt(idxFromEvent(e));},{passive:true});
  }

  function dayTable(cur){
    var rows=binRows(cur, state.gran).slice();      // ascending
    var el=h('<div class="tablewrap anim"></div>');
    var cols=[['checkins','Check-ins'],['verified','Verified'],['openers','Openers'],['active_users','Active'],['new_users','New'],['reactions','Reactions'],['nudges','Nudges']];
    // Columns for the newer per-day series, added only once the SQL ships them —
    // an absent key would fill the table with zeros that look like real zeros.
    [['comments','Comments'],['invites','Invites'],['clicks','Clicks']].forEach(function(c){
      if(dailyHasKey(RAW.daily, c[0])) cols.push(c);

    var thead='<thead><tr><th>'+(state.gran==='week'?'Week of':'Day')+'</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+'</tr></thead>';

    var body='';
    for(var i=rows.length-1;i>=0;i--){

    var tfoot='<tfoot><tr><td>Total</td>'+cols.map(function(c){
      var v=isAvg(c[0])? mean(cur,c[0]) : sum(cur,c[0]);

    el.innerHTML='<table>'+thead+'<tbody>'+(body||'<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;color:var(--muted)">No data in range</td></tr>')+'</tbody>'+tfoot+'</table>';
    return el;
  }

  function barPanel(title, items, labelFn, hotIdx){

    }).join('');
    return '<div class="panel"><div class="cl" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:8px">'+esc(title)+'</div><div class="bars">'+bars+'</div></div>';
  }
